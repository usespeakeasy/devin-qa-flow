# Open a drill lesson and skip every card until the lesson end shows the streak goal step
# ("Set your streak goal, make a commitment", four goals and I'm committed).
# Entry: Home, signed in. Preconditions: a build whose lesson end flow has the STREAK_GOAL_SETTING step.
# The dev server sends it rarely, so QA runs put `LessonFinishedFlow.Component.STREAK_GOAL_SETTING`
# first in the order in `LessonEndFlowViewModel.updateScreens` as a QA-only patch.
# The widget prompt after the goal shows only with no Speak streak widget on the home screen; the QA-only
# `debug.qa.widget` prop patch in `StreakWidgetInstaller.shouldPromptWidgetInstall` hides it
# (`adb shell setprop debug.qa.widget installed`, empty string to undo).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
# Optional referral welcome prompt.
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      notVisible:
        id: goal_7days
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: goal_7days
    timeout: 30000
- assertVisible:
    id: streak_goal_label
- assertVisible:
    id: primary_button
