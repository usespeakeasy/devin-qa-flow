# Open a drill lesson and skip every card until the lesson end shows the takeaways step
# ("Feedback for you|Where you can improve" with the feedback cards and Next).
# Entry: Home, signed in. Preconditions: a build whose lesson end flow has the TAKEAWAYS step with
# teaching points. The dev server rarely sends it for a drill lesson, so QA runs put
# `LessonFinishedFlow.Component.TAKEAWAYS` first in `LessonEndFlowViewModel.updateScreens` and make
# `TakeawaysRepositoryFactory` / `TakeawayVotingRepositoryFactory` return their demo repositories
# (Multiple Cards, generated lesson = a real dev lesson id) as a QA-only patch.
# Selectors: the takeaways screen has no resource-id yet (text fallback "Feedback for you|Where you can improve").
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      notVisible: "Feedback for you|Where you can improve"
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible: "Feedback for you|Where you can improve"
    timeout: 30000
- assertVisible: "Next"
