# Retype only the password on the email sign-in sheet and submit.
# Keep the failed password short (under ~10 chars): tapOn hits the field's centre, and the
# cursor lands at the end only when the masked text is shorter than half the field.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: onboarding_sign_in_password_field
- eraseText: 20
- inputText: ${PASSWORD}
- tapOn:
    id: onboarding_sign_in_submit_button
