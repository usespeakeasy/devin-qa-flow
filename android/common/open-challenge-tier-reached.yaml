# Open a drill lesson and skip every card until the lesson end shows the challenge tier reached step
# (challenge title, "You won ..." card and Continue).
# Entry: Home, signed in, Debug Menu > Subscription override > Premium.
# Preconditions: a build whose lesson end flow has the CHALLENGES step. The dev server sends it only when
# a lesson pushes the learner into a new tier of a running challenge, so QA runs put
# `LessonFinishedFlow.Component.CHALLENGES` first in the order in `LessonEndFlowViewModel.updateScreens`
# (with one fixed `LessonFinishedFlow.Challenge` when the server sends none) as a QA-only patch.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      notVisible:
        id: challenge_tier_reached
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: challenge_tier_reached
    timeout: 30000
- assertVisible:
    id: card_title
- assertVisible:
    id: primary_button
