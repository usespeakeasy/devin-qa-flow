# Walk the rest of the lesson end flow to Home: the readout (lesson_end_reskin_root) Continue,
# streak goal setting (pick 7 days), the earned Streak Freeze step (Got it), the home screen widget prompt (Maybe later), level progress
# and any other step with a primary button. The steps after the readout depend on the server.
# Entry: any lesson end step after the review dialog (the streak progress step is tapped through). Exit: home_root_ready.
# Selectors: the widget prompt has no resource-id (text fallback "Maybe later").
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- repeat:
    while:
      notVisible:
        id: home_root_ready
    times: 12
    commands:
      - tapOn:
          id: lesson_end_reskin_continue_button
          optional: true
      - tapOn:
          id: lesson_end_streak_progress_continue_button
          optional: true
      - tapOn:
          id: lesson_end_streak_freeze_got_it_button
          optional: true
      - tapOn:
          id: goal_7days
          optional: true
      - tapOn:
          id: primary_button
          optional: true
      - tapOn:
          text: "Maybe later"
          optional: true
      # App rating prompt over the lesson end (it blocks primary_button on the Challenge tier step).
      - tapOn:
          id: ask_for_review_dialog_no
          optional: true
      - tapOn:
          id: ask_for_review_negative_dialog_no
          optional: true
      - tapOn:
          id: ask_for_review_positive_dialog_no
          optional: true
      # Smart Review "New Concept" step: its Continue has no resource-id on release/4.73.0 (text fallback).
      - runFlow:
          when:
            visible: "Review them later in the Practice Tab!"
          commands:
            - tapOn: "^Continue$"
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
