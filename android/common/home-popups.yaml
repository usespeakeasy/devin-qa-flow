# Home after a cold start or login: close the referral welcome dialog and the "Find your English level" sheet
# (app_assessment_popup), the "Save your N-day streak!" sheet (course_streak_save_dialog_root) and the
# "Made for you" custom course sheet (custom_courses_announcement_sheet) the "Good to see you again!" unit review sheet (unit_refresher_popup) and the "Restart your streak" lesson (appetizer_lesson_dialog) when they show, and wait for Home.
# Entry: app starting on Home. Exit: Home (home_root_ready) with no popup.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      id: "home_root_ready|app_assessment_popup|referral_welcome_dialog_root|course_streak_save_dialog_root|custom_courses_announcement_sheet|unit_refresher_popup|appetizer_lesson_dialog"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: referral_welcome_dialog_later_button
    optional: true
- runFlow:
    when:
      visible:
        id: app_assessment_popup
    commands:
      - back
- runFlow:
    when:
      visible:
        id: course_streak_save_dialog_root
    commands:
      - back
- runFlow:
    when:
      visible:
        id: custom_courses_announcement_sheet
    commands:
      - back
- tapOn:
    id: appetizer_lesson_close
    optional: true
- runFlow:
    when:
      visible:
        id: unit_refresher_popup
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 20000
- assertNotVisible:
    id: referral_welcome_dialog_root
- assertNotVisible:
    id: course_streak_save_dialog_root
- assertNotVisible:
    id: custom_courses_announcement_sheet
- assertNotVisible:
    id: unit_refresher_popup
- assertNotVisible:
    id: appetizer_lesson_dialog
