# Takeaways step: swipe to the second card and back, tap Next until the last card, then Continue.
# With a takeaways lesson (QA patch default) Continue shows "Time to practice"; with
# `debug.qa.takeaways nolesson` it ends the step. Exit: right after the Continue tap.
# Entry: the takeaways step is showing (`android/common/open-takeaways.yaml`).
# Selectors: TakeawaysTestTags ids; the primary button is Next until the last card, where its text is
# "Continue" (its text node is a child of the id). The card pager swipe uses screen percentages because the pager has no id.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: lesson_end_takeaways_root
# Card pager has no id: swipe across its middle band.
- swipe:
    start: 85%, 45%
    end: 15%, 45%
- swipe:
    start: 15%, 45%
    end: 85%, 45%
- repeat:
    while:
      notVisible:
        text: "Continue"
        childOf:
          id: lesson_end_takeaways_primary_button
    times: 6
    commands:
      - tapOn:
          id: lesson_end_takeaways_primary_button
- extendedWaitUntil:
    visible:
      text: "Continue"
      childOf:
        id: lesson_end_takeaways_primary_button
    timeout: 10000
- tapOn:
    id: lesson_end_takeaways_primary_button
