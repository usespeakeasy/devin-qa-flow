# Takeaways step: swipe to the second card and back, tap Next until the last card, then Continue.
# With a takeaways lesson (QA patch default) Continue shows "Time to practice"; with
# `debug.qa.takeaways nolesson` it ends the step. Exit: right after the Continue tap.
# Entry: the takeaways step is showing (`android/common/open-takeaways.yaml`).
# Selectors: no resource-ids on the takeaways screen (text fallbacks "Feedback for you|Where you can improve", "Next",
# "Continue"); the card pager swipe uses screen percentages because the pager has no id.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible: "Feedback for you|Where you can improve"
# Card pager has no id: swipe across its middle band.
- swipe:
    start: 85%, 45%
    end: 15%, 45%
- swipe:
    start: 15%, 45%
    end: 85%, 45%
- repeat:
    while:
      notVisible: "Continue"
    times: 6
    commands:
      - tapOn: "Next"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: "Continue"
