# Open a drill lesson and skip every card until the lesson end shows the streak progress step
# ("N day streak" with the week calendar and Continue).
# Entry: Home, signed in. Preconditions: a build whose lesson end flow has the STREAK_PROGRESS step.
# The dev server sends it only for the first finished lesson of the day, so QA runs put
# `LessonFinishedFlow.Component.STREAK_PROGRESS` first in the order in `LessonEndFlowViewModel.updateScreens`
# (with fixed streak data when the server sends none) as a QA-only patch.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- runFlow: tap-debug-finish.yaml
- repeat:
    while:
      notVisible:
        id: lesson_end_streak_progress_root
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: lesson_end_streak_progress_continue_button
    timeout: 30000
