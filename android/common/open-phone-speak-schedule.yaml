# Phone Speak schedule screen from the deep link speak-dev://phone-speak?action=schedule, with the
# "Ring my phone" card showing (needs a Premium Plus entitled account with one saved slot, and the
# server's ring arm plus FCM call sender on for Android).
# Entry: signed in, any screen. Exit: the Weekly Schedule screen with the ring card.
# Arrival is the Weekly Schedule root `phone_speak_schedule_standalone_screen` plus the ring switch
# `phone_speak_schedule_ring_switch` (speak-android#8752; builds before it export neither).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LINK: ${LINK || "speak-dev://phone-speak?action=schedule"}
---
- openLink: ${LINK}
- extendedWaitUntil:
    visible:
      id: phone_speak_schedule_standalone_screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: phone_speak_schedule_ring_switch
    timeout: 15000
