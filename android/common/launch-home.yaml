# Cold-start the app and wait for Home's learning path.
# Precondition: signed in (harness `qa_android.py login`).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- launchApp:
    stopApp: true
# A signed-in cold start can show the referral promo over Home; close it so learning_path_ready shows.
- extendedWaitUntil:
    visible:
      id: "learning_path_ready|referral_welcome_dialog_later_button"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: referral_welcome_dialog_later_button
    commands:
      - tapOn:
          id: referral_welcome_dialog_later_button
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 60000
