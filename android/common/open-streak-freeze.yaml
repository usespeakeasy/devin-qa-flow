# Open a drill lesson and skip every card until the lesson end shows the streak freeze step
# ("You earned N Streak Freeze!" with Got it).
# Entry: Home, signed in, Debug Menu > Subscription override > Premium.
# Preconditions: a build whose lesson end flow has the STREAK_FREEZE step. The dev server sends it
# only when the lesson earns a streak freeze, so QA runs put `LessonFinishedFlow.Component.STREAK_FREEZE`
# first in the order in `LessonEndFlowViewModel.updateScreens` (with fixed StreakFreezeData when the
# server sends none) as a QA-only patch.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      notVisible:
        id: lesson_end_streak_freeze_root
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: lesson_end_streak_freeze_got_it_button
    timeout: 30000
