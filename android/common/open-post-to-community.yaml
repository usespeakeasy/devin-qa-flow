# Open a drill lesson and skip every card until the lesson end shows the post to community step
# ("Upload to community" with the scenario card and "Share with the community").
# Entry: Home, signed in, Debug Menu > Subscription override > Premium.
# Preconditions: a build whose lesson end flow has the COMMUNITY_SCENARIO step. The dev server sends it only
# for some lessons, so QA runs put `LessonFinishedFlow.Component.COMMUNITY_SCENARIO` first in the order in
# `LessonEndFlowViewModel.updateScreens`, with a fixed CommunityScenario ("QA coffee chat") when the server
# sends none, as a QA-only patch.
# Selectors: post to community has no resource IDs (text fallback, ID PR speak-android#8720).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- runFlow: tap-debug-finish.yaml
- repeat:
    while:
      notVisible: "Share with the community"
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible: "Share with the community"
    timeout: 30000
- assertVisible: "Upload to community"
