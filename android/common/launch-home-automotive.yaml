# Automotive build (automotiveDevelopDebug on an AAOS emulator): cold-start, open the parked phone UI, dismiss Home popups, wait for Home.
# Precondition: signed in (harness `qa_android.py bridge login`; `login` can't launch the unexported SpeakActivity),
# car parked (the AAOS emulator starts in gear P).
# Selectors: the automotive home's open-app button and the system notification dialog have no
# resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  APP_LABEL: ${APP_LABEL || "Speak - Dev"}
---
# Home closes a climate panel a stray swipe may have left open.
- pressKey: Home
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "^${APP_LABEL}$"
    timeout: 30000
- tapOn: "^${APP_LABEL}$"
# The custom courses announcement can open over Home before anything else shows.
- extendedWaitUntil:
    visible: "Close sheet"
    timeout: 15000
    optional: true
- runFlow: ../flows/ai-data-consent/dismiss-home-popups.yaml
- extendedWaitUntil:
    visible:
      id: "learning_path_ready|referral_welcome_dialog_later_button|onboarding_notification_permission_skip_button"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: onboarding_notification_permission_skip_button
    commands:
      - tapOn:
          id: onboarding_notification_permission_skip_button
      - extendedWaitUntil:
          visible: "^OK$"
          timeout: 10000
      - tapOn: "^OK$"
- extendedWaitUntil:
    visible:
      id: "learning_path_ready|referral_welcome_dialog_later_button"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: referral_welcome_dialog_later_button
    commands:
      - tapOn:
          id: referral_welcome_dialog_later_button
- runFlow: ../flows/ai-data-consent/dismiss-home-popups.yaml
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 60000
