# Debug Menu > Dialog Bridges > "Subway Mode": the "Can't speak now" explanation dialog
# (`Destination.SubwayModeDialog`, Nav 3 entry or `ComposeDialogBridgeController` with the kill switch ON).
# Entry: any signed-in state (restarts the app, opens speak-dev://debug-menu). Exit: the dialog shows.
# Saves SHOT.png (the open dialog) under ~/.maestro/tests/<run>/<flow>/takeScreenshot/.
# Note: showing it sets the "explanation displayed" pref, so run first-toggle cases before this one.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 60000
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible: "Debug Menu"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Dialog Bridges"
    direction: DOWN
    timeout: 20000
- tapOn: "Dialog Bridges"
- scrollUntilVisible:
    element:
      text: "Subway Mode"
    direction: DOWN
    timeout: 30000
- tapOn: "Subway Mode"
- extendedWaitUntil:
    visible:
      id: subway_mode_dialog
    timeout: 15000
- assertVisible:
    id: subway_mode_dialog_button
- takeScreenshot: ${SHOT || "subway-mode-bridge"}
