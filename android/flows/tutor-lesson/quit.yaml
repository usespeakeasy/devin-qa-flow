# Tutor lesson > close > "Are you sure you want to quit this lesson?" > Quit. Entry: drill lesson (QA-only
# always-confirm close patch). Exit: the lesson is gone (abandon feedback, check-in or Home, per the run's setup).
# Selectors: the close confirmation dialog has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: lesson_top_bar_close
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 15000
- tapOn: "^Quit$"
- extendedWaitUntil:
    notVisible:
      id: drill_lesson_root
    timeout: 30000
