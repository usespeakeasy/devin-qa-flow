# Tutor lesson > sliders (drill_lesson_topbar_options) > Report a problem > REASON > report screen.
# Entry: drill lesson. Exit: the report screen (`report_screen`); the attached screenshot is the app's
# cache/reportedContentData/screenshot.jpg (pull with run-as to check what it captured).
# Selectors: the lesson options sheet rows have no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  REASON: ${REASON || "content_error"}
  REASON_TEXT: ${REASON_TEXT || "Content error"}
---
- tapOn:
    id: drill_lesson_topbar_options
- extendedWaitUntil:
    visible: "^Report a problem$"
    timeout: 10000
- tapOn: "^Report a problem$"
# release/4.73.0's reason sheet has no lesson_more_options_* ids: wait for its rows, tap REASON_TEXT there.
- extendedWaitUntil:
    visible: "^Speech recognition$"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: lesson_more_options_list
    commands:
      - tapOn:
          id: lesson_more_options_report_problem_${REASON}
- runFlow:
    when:
      visible: "^Speech recognition$"
    commands:
      - tapOn: ${REASON_TEXT}
# release/4.73.0's report screen has no report_screen id (text fallback: its input placeholder).
- extendedWaitUntil:
    visible: "Any additional details to share\\?"
    timeout: 15000
- assertNotVisible: "^Speech recognition$"
