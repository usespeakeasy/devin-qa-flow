# Tutor (drill) lesson by deep link (LESSON_ID). Entry: Home, signed in. Exit: the drill lesson shows Next.
# Restore progress: a lesson with saved progress opens "Continue where you left off?" first; the flow exits on that dialog.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP_DL_IC"}
---
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_root
    timeout: 30000
    optional: true
# A lesson with saved progress opens "Continue where you left off?" instead; that is a valid exit too.
- runFlow:
    when:
      notVisible:
        id: drill_lesson_root
    commands:
      - extendedWaitUntil:
          visible: "Continue where you left off\\?"
          timeout: 5000
          optional: true
# The drill route sometimes stays blank after a deep link right after another lesson; restart the app and open it again.
- runFlow:
    when:
      notVisible: "Continue where you left off\\?"
    commands:
      - runFlow:
          when:
            notVisible:
              id: drill_lesson_root
          commands:
            - launchApp:
                stopApp: true
            - extendedWaitUntil:
                visible:
                  id: home_root_ready
                timeout: 60000
            - openLink: speak-dev://lesson?id=${LESSON_ID}
            - extendedWaitUntil:
                visible:
                  id: drill_lesson_root
                timeout: 60000
