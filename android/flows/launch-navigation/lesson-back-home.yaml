# Leave an open lesson for what is under it: Preview Finished > Return home, or Back > Quit on the quit sheet; the
# premium intro the quit can show is dismissed. Asserts Home (learning_path_ready) on the Home tab. Saves SHOT.png.
# Entry: a lesson or Preview Finished showing. Exit: Home tab.
# Selectors: the quit sheet has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "lesson-back"}
---
- runFlow:
    when:
      visible:
        id: preview_finished_screen
    commands:
      - tapOn:
          id: preview_finished_return_home_button
- runFlow:
    when:
      visible:
        id: "card_count|drill_lesson_root"
    commands:
      - back
      - extendedWaitUntil:
          visible: "Are you sure you want to quit this lesson\\?|^Quit$"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: "^Quit$"
          commands:
            - tapOn: "^Quit$"
- runFlow:
    when:
      visible:
        id: preview_finished_screen
    commands:
      - tapOn:
          id: preview_finished_return_home_button
- runFlow: ../../common/dismiss-premium-intro.yaml
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 20000
- assertVisible:
    id: main_tab_home
- takeScreenshot: ${SHOT}
