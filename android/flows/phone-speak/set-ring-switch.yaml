# Phone Speak schedule: set "Ring my phone" to CHECKED (true or false) and wait for the save to land.
# A full-screen alerts dialog or a system microphone prompt the switch opens is left for the caller.
# Entry: open-phone-speak-schedule. maestro test -e CHECKED=false set-ring-switch.yaml
# Selectors: the switch row has no resource-id. It is the only checkable node on the screen, so
# `checked: true` finds it when on (Maestro drops `checked` when combined with containsDescendants);
# it is tapped by its title text.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  CHECKED: ${CHECKED || "false"}
---
- runFlow:
    when:
      true: ${CHECKED == "true"}
      notVisible:
        checked: true
    commands:
      - tapOn: "Ring my phone"
      - extendedWaitUntil:
          visible:
            checked: true
          timeout: 15000
- runFlow:
    when:
      true: ${CHECKED != "true"}
      visible:
        checked: true
    commands:
      - tapOn: "Ring my phone"
      - extendedWaitUntil:
          notVisible:
            checked: true
          timeout: 15000
