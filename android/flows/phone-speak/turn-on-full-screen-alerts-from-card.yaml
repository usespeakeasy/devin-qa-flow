# Phone Speak schedule: from the ring card's full-screen alerts notice, tap "Turn on full-screen
# alerts", allow full-screen notifications on Android's page for Speak, come back, and check the
# notice is gone. Skipped (no-op) when the notice isn't showing, e.g. on a build without it.
# Entry: open-phone-speak-schedule with the notice showing. Exit: the schedule screen.
# Writes the screenshot SHOT (default full-screen-alerts-settings.png) of Android's page.
# Selectors: `phone_speak_schedule_ring_turn_on_full_screen_alerts` (exported since speak-android#8752).
# Android's page is matched by text; its switch row is the only checkable node there.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  SHOT: ${SHOT || "full-screen-alerts-settings"}
---
- runFlow:
    when:
      visible:
        id: phone_speak_schedule_ring_turn_on_full_screen_alerts
    commands:
      - tapOn:
          id: phone_speak_schedule_ring_turn_on_full_screen_alerts
      - extendedWaitUntil:
          visible: "Allow full-screen notifications from this app"
          timeout: 15000
      - takeScreenshot: ${SHOT}
      - assertNotVisible:
          checked: true
      - tapOn: "Allow full-screen notifications from this app"
      - extendedWaitUntil:
          visible:
            checked: true
          timeout: 10000
      - back
      - extendedWaitUntil:
          visible:
            id: phone_speak_schedule_standalone_screen
          timeout: 15000
      - extendedWaitUntil:
          notVisible:
            id: phone_speak_schedule_ring_turn_on_full_screen_alerts
          timeout: 10000
