# Tap Save in the edit sheet. EXPECT=closed waits for the sheet to close (the server accepted the time);
# EXPECT=open waits WAIT ms for the answer, then checks the sheet is still open with Save and Delete enabled.
# Entry: edit sheet. Params: EXPECT (closed|open), WAIT (ms), TIMEOUT (ms to wait for the close).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn:
    id: advance_commitment_edit_action_save
- runFlow:
    when:
      true: ${EXPECT == 'closed'}
    commands:
      - extendedWaitUntil:
          notVisible:
            id: advance_commitment_edit_ready
          timeout: ${TIMEOUT}
- runFlow:
    when:
      true: ${EXPECT == 'open'}
    commands:
      - extendedWaitUntil:
          visible:
            id: no_such_node_qa_wait
          timeout: ${WAIT}
          optional: true
      - assertVisible:
          id: advance_commitment_edit_ready
      - assertVisible:
          id: advance_commitment_edit_action_save
          enabled: true
      - assertVisible:
          id: advance_commitment_edit_action_delete
          enabled: true
