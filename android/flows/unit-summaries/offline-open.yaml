# Unit Summaries offline: airplane mode on, tap the book icon on Home; Unit Summaries opens from the cached summary
# (the run opens it online first). The flow asserts the screen only; the run checks the sections with harness `has`.
# Leaves airplane mode ON: run common/airplane-off.yaml after the screenshot.
# Entry: Home tab showing learning_path_ready, summary opened online before. Exit: Unit Summaries, offline.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: ../../common/airplane-on.yaml
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 30000
- scrollUntilVisible:
    element:
      id: learning_path_unit_summary_button
    direction: DOWN
    timeout: 60000
- tapOn:
    id: learning_path_unit_summary_button
- extendedWaitUntil:
    visible:
      id: unit_summaries_screen
    timeout: 20000
