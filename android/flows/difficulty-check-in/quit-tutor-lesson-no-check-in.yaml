# Once per unit: after the check-in was answered for this unit, quitting a lesson in the same unit goes straight
# to Home with no check-in.
# Entry: Home, the check-in already handled for the current `debug.qa.unit_no`; QA-only patches as quit-tutor-lesson.yaml.
# Exit: Home. Selectors: the close confirmation dialog has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 30000
    optional: true
# The drill route sometimes stays blank after a deep link right after another lesson; restart the app and open it again.
- runFlow:
    when:
      notVisible:
        id: drill_lesson_skip
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: home_root_ready
          timeout: 60000
      - openLink: speak-dev://lesson?id=${LESSON_ID}
      - extendedWaitUntil:
          visible:
            id: drill_lesson_skip
          timeout: 60000
- tapOn:
    id: drill_lesson_skip
- tapOn:
    id: lesson_top_bar_close
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 15000
- tapOn: "^Quit$"
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
- assertNotVisible:
    id: custom_units_difficulty_check_in
