# Process death with the quit check-in open: the system kills the app in the background, relaunch restores the check-in.
# Entry: the check-in from quit-*.yaml. Exit: the restored check-in, Home not showing.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: custom_units_difficulty_check_in_just_right
    timeout: 60000
- assertNotVisible:
    id: home_root_ready
