# Finish a Tutor (drill) lesson: skip card by card until the difficulty check-in shows as a lesson end step.
# Entry: as quit-ai-lesson.yaml (QA-only gate patch, new `debug.qa.unit_no`). Exit: the check-in shows.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 30000
    optional: true
# The drill route sometimes stays blank after a deep link right after another lesson; restart the app and open it again.
- runFlow:
    when:
      notVisible:
        id: drill_lesson_skip
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: home_root_ready
          timeout: 60000
      - openLink: speak-dev://lesson?id=${LESSON_ID}
      - extendedWaitUntil:
          visible:
            id: drill_lesson_skip
          timeout: 60000
- repeat:
    while:
      notVisible:
        id: custom_units_difficulty_check_in_just_right
    times: 80
    commands:
      - tapOn:
          id: "drill_lesson_skip|lesson_end_continue_button|lesson_end_.*_continue.*"
          optional: true
- assertVisible:
    id: custom_units_difficulty_check_in_just_right
- assertNotVisible:
    id: drill_lesson_root
