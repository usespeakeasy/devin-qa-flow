# Dialog Bridges > Vocab Info sheet: Got it, Back, outside tap close it; a double tap on Got it closes only the sheet. Text fallback: no resource ids.
# Entry: signed in. Exit: Dialog Bridges.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow:
    file: ../../common/open-dialog-bridge.yaml
    env:
      ROW: vocab_info
      RESTART: "true"
- extendedWaitUntil:
    visible:
      text: "Vocab and Expressions"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: vocab-info-close_open
- tapOn:
    text: "Got it"
- extendedWaitUntil:
    notVisible:
      text: "Vocab and Expressions"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "debug_dialog_bridges_screen"
    timeout: 10000
- takeScreenshot: vocab-info-close_after_button
- runFlow:
    file: ../../common/open-dialog-bridge.yaml
    env:
      ROW: vocab_info
      RESTART: "false"
- extendedWaitUntil:
    visible:
      text: "Vocab and Expressions"
    timeout: 10000
- back
- extendedWaitUntil:
    notVisible:
      text: "Vocab and Expressions"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "debug_dialog_bridges_screen"
    timeout: 10000
- runFlow:
    file: ../../common/open-dialog-bridge.yaml
    env:
      ROW: vocab_info
      RESTART: "false"
- extendedWaitUntil:
    visible:
      text: "Vocab and Expressions"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    notVisible:
      text: "Vocab and Expressions"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "debug_dialog_bridges_screen"
    timeout: 10000
- takeScreenshot: vocab-info-close_after_outside
- runFlow:
    file: ../../common/open-dialog-bridge.yaml
    env:
      ROW: vocab_info
      RESTART: "false"
- extendedWaitUntil:
    visible:
      text: "Vocab and Expressions"
    timeout: 10000
- waitForAnimationToEnd
- doubleTapOn:
    text: "Got it"
- extendedWaitUntil:
    notVisible:
      text: "Vocab and Expressions"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: vocab-info-close_after_double_tap
