# Explore: scroll the shown category's list down by TIMES slow drags (no fling), so each category
# can sit at its own scroll position.
# Entry: Explore on a category. Exit: same category, scrolled.
# maestro test -e TIMES=3 scroll-list.yaml
# Selectors: list, action_history (Explore from Profile) or action_profile (Explore tab). The drag is a point swipe (the list is the whole lower screen).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- repeat:
    times: ${TIMES}
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 50%
          duration: 1500
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: list
- assertVisible:
    id: "action_history|action_profile"
