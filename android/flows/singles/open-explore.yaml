# Profile > Explore: the singles Explore screen opens with its category tabs.
# Entry: Home tab. Precondition: ko-en or ja-en dev account, experiment learning_path_explore ON
# (Debug Menu > Feature flag override, flows/debug-menu/set-feature-flag.yaml).
# Home popups (app_assessment_popup, the referral prompt) are closed first.
# Selectors: the Profile "Explore" option row is profile_explore_option (speak-android #8686, develop
# f8152ec5d4); builds older than that fall back to its "Explore" text. The bottom tab and the referral
# popup's "Later" have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow:
    when:
      visible:
        id: app_assessment_popup
    commands:
      - back
- tapOn:
    text: "Later"
    optional: true
- tapOn: "Profile"
- tapOn:
    text: "Later"
    optional: true
- extendedWaitUntil:
    visible:
      id: action_settings
    timeout: 20000
- scrollUntilVisible:
    element:
      id: profile_explore_option
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: profile_explore_option
    commands:
      - scrollUntilVisible:
          element:
            text: "Explore"
      - tapOn:
          text: "Explore"
- runFlow:
    when:
      visible:
        id: profile_explore_option
    commands:
      - tapOn:
          id: profile_explore_option
- extendedWaitUntil:
    visible:
      id: action_history
    timeout: 30000
