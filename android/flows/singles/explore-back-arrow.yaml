# Explore (from Profile): the toolbar back arrow closes it and Profile shows again.
# Entry: Explore opened from Profile (open-explore.yaml). Exit: Profile tab.
# Selectors: singles_toolbar_navigation (toolbar back arrow), singles_explore_screen, action_settings.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: action_history
- tapOn:
    id: singles_toolbar_navigation
- extendedWaitUntil:
    visible:
      id: action_settings
    timeout: 15000
- assertNotVisible:
    id: singles_explore_screen
