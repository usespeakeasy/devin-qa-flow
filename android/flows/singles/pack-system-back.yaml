# Pack: system back closes the pack and Explore shows again.
# Entry: pack screen. Exit: Explore.
# Selectors: action_history, header_title.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- back
- extendedWaitUntil:
    visible:
      id: action_history
    timeout: 15000
- assertNotVisible:
    id: header_title
