# Tutor chat: send MESSAGE in the open thread and wait for the reply.
# Entry: tutor chat (input_message). Exit: tutor chat with the reply shown. Params: MESSAGE (required).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      id: input_message
      enabled: true
    timeout: 20000
- tapOn:
    id: input_message
- inputText: ${MESSAGE}
- tapOn:
    id: send_button
- extendedWaitUntil:
    visible:
      id: tutor_outgoing_message_row
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: input_message
      enabled: true
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: input_message
      enabled: true
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
