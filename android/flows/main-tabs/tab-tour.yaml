# Bottom nav tour: Home -> Profile -> Challenge -> Home.
# Entry: cold start, signed in. The Challenge tab shows the Leagues placeholder (placeholder_title)
# when Leagues are locked, or the league tier list (tier_list) when they are open.
# Selectors: Profile/Challenge/Home tab items have no resource-id yet (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/launch-home.yaml
- tapOn: "Profile"
- assertVisible:
    id: stat_streak_title
- tapOn: "Challenge"
- extendedWaitUntil:
    visible:
      id: "placeholder_title|tier_list"
    timeout: 15000
- tapOn: "Home"
- assertVisible:
    id: learning_path_ready
