# Practice tab: the Practice hub shows with its Smart Review card. The hub's sections are server-driven ("Quick lessons"
# is not always there), so the flow checks ids, not section titles.
# Entry: Home tab. Precondition: signed-in dev account with the Practice tab.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  SHOT: arrival
---
- tapOn:
    id: main_tab_practice
- extendedWaitUntil:
    visible:
      id: practice_tab_list
    timeout: 20000
- scrollUntilVisible:
    element:
      id: practice_tab_card_smart_review
    direction: DOWN
    timeout: 10000
- takeScreenshot: ${SHOT}
