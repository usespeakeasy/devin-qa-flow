# Free Talk tab (AI Tutor) > Topics: the topic category list shows.
# Entry: Home tab. Precondition: signed-in dev account with the AI Tutor tab (Community and Topics).
# The AI Tutor intro, if shown, is closed with Get started.
# Selectors: the bottom tab and the Topics tab have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  SHOT: arrival
---
- tapOn: "Free Talk"
# The first Free Talk visit on an install shows the AI Tutor intro over the tab; Get started closes only the dialog.
- extendedWaitUntil:
    visible:
      id: "ai_tutor_title|ai_tutor_intro_dialog_get_started_button"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: ai_tutor_intro_dialog_get_started_button
    commands:
      - tapOn:
          id: ai_tutor_intro_dialog_get_started_button
      - extendedWaitUntil:
          notVisible:
            id: ai_tutor_intro_dialog
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: ai_tutor_title
    timeout: 20000
- tapOn: "Topics"
- extendedWaitUntil:
    visible:
      id: ai_tutor_overview_root
    timeout: 20000
- takeScreenshot: ${SHOT}
