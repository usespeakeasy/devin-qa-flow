# Closed app next-lesson link: leave the app on START_TAB, stop it, open speak-dev://course/next-lesson. The next lesson
# (ARRIVAL) opens, Back returns to Home on the Home tab, and a tab switch does not start it again.
# Entry: signed in, Home ready. Exit: Home tab.
# maestro test -e START_TAB=main_tab_practice -e ARRIVAL=drill_lesson_root -e SHOT=next-lesson next-lesson-cold.yaml
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/launch-home.yaml
- tapOn:
    id: ${START_TAB}
- waitForAnimationToEnd:
    timeout: 3000
- stopApp
- openLink: speak-dev://course/next-lesson
- extendedWaitUntil:
    visible:
      id: ${ARRIVAL}
    timeout: 45000
- takeScreenshot: ${SHOT}
- back
# A video lesson answers Back with the quit sheet, and quitting opens the premium intro (dev paywall error on the emulator).
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Are you sure you want to quit this lesson\\?"
    commands:
      - tapOn: "^Quit$"
      - runFlow: ../../common/dismiss-premium-intro.yaml
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 20000
- takeScreenshot: ${SHOT}-back
# A duplicate link run re-opened the lesson 0.6 to 2 s after Back (speak-android#9358); hold Home for 6 s.
- runFlow: assert-nothing-reopened.yaml
- runFlow: assert-nothing-reopened.yaml
- assertNotVisible:
    id: ${ARRIVAL}
- tapOn:
    id: main_tab_practice
- tapOn:
    id: main_tab_home
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 20000
- runFlow: assert-nothing-reopened.yaml
