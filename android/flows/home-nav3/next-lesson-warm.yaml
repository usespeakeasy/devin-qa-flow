# Running app next-lesson link: optionally leave the app on START_TAB in the background (launcher Home key, no stop), then open
# speak-dev://course/next-lesson. The next lesson (ARRIVAL) opens, Back returns to Home, and Home stays for at least 6 s.
# Entry: signed in, app running (Home showing, or any tab with START_TAB). Exit: Home tab.
# maestro test -e ARRIVAL=card_count -e SHOT=warm-link next-lesson-warm.yaml
# maestro test -e START_TAB=main_tab_practice -e ARRIVAL=card_count -e SHOT=bg-link next-lesson-warm.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  START_TAB: ${START_TAB || "none"}
---
- runFlow:
    when:
      true: ${START_TAB != "none"}
    commands:
      - tapOn:
          id: ${START_TAB}
      - waitForAnimationToEnd:
          timeout: 3000
      - pressKey: Home
- openLink: speak-dev://course/next-lesson
- extendedWaitUntil:
    visible:
      id: ${ARRIVAL}
    timeout: 45000
- takeScreenshot: ${SHOT}
- back
# A video lesson answers Back with the quit sheet, and quitting opens the premium intro (dev paywall error on the emulator).
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Are you sure you want to quit this lesson\\?"
    commands:
      - tapOn: "^Quit$"
      - runFlow: ../../common/dismiss-premium-intro.yaml
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 20000
- takeScreenshot: ${SHOT}-back
# A duplicate link run re-opened the lesson 0.6 to 2 s after Back (speak-android#9358); hold Home for 6 s.
- runFlow: assert-nothing-reopened.yaml
- runFlow: assert-nothing-reopened.yaml
- assertNotVisible:
    id: ${ARRIVAL}
