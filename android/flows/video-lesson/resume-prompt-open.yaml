# Video lesson with saved progress: opening it shows one "Continue where you left off?" prompt; two fast system
# Backs keep it (not cancelable).
# Entry: Home, the lesson was quit after its first group (progress saved). Exit: the resume prompt.
# Check the transparent window in `adb shell dumpsys window` (no FLAG_DIM_BEHIND / dimAmount 0 on the dialog).
# Selectors: the resume prompt has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "KR_EN_UC_L1_howstheweather_VL"}
---
- runFlow: ../../common/home-popups.yaml
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible: "Continue where you left off\\?"
    timeout: 60000
- takeScreenshot: ${SHOT || "resume-prompt"}
- back
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Continue where you left off\\?"
- assertVisible: "^Continue$"
- assertVisible: "^Start over$"
