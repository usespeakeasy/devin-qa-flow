# Video lesson after process death with the quit sheet open: the sheet comes back over the lesson
# (as Conductor restores it), Keep Learning closes it and the lesson is on a card again.
# Entry: quit sheet open, the harness killed the backgrounded process (`am kill`) and relaunched.
# Exit: video lesson, card CARD, no quit sheet.
# Selectors: the sheet has no automation IDs on develop (text fallback; see speak-android #8710), card_count.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "restored-quit-sheet"}
  CARD: ${CARD || "\\d+ of \\d+"}
---
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 30000
- takeScreenshot: ${SHOT}
- tapOn: "^Keep Learning$"
- extendedWaitUntil:
    notVisible: "Are you sure you want to quit this lesson\\?"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: card_count
      text: ${CARD}
    timeout: 20000
- assertNotVisible: "Are you sure you want to quit this lesson\\?"
