# Smart Review mastery page > review status row opens AllConcepts; close returns to the mastery page.
# Entry: Home tab. Precondition: debug build with the QA Smart Review fixture (adb shell setprop debug.qa.srdata fixture) or an account with concepts.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: main_tab_practice
- extendedWaitUntil:
    visible:
      id: practice_tab_card_smart_review
    timeout: 20000
- tapOn:
    id: practice_tab_card_smart_review
- extendedWaitUntil:
    visible:
      id: smart_review_practice_tab
    timeout: 20000
- tapOn:
    id: smart_review_mastery_score_card
- extendedWaitUntil:
    visible:
      id: smart_review_review_status_row
    timeout: 10000
- tapOn:
    id: smart_review_review_status_row
- extendedWaitUntil:
    visible:
      id: smart_review_all_concepts_list
    timeout: 15000
- takeScreenshot: all-concepts
- tapOn:
    id: smart_review_all_concepts_close_button
- extendedWaitUntil:
    visible:
      id: smart_review_mastery_score_page
    timeout: 10000
- assertNotVisible:
    id: smart_review_all_concepts_screen
- takeScreenshot: all-concepts-closed
