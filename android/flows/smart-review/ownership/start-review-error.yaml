# Smart Review Start review (premium): launch attempt; on a lesson-generation error the dialog OK keeps the same Main screen.
# Entry: Home tab. Precondition: premium account and QA fixture (adb shell setprop debug.qa.srdata fixture); fixture concept ids make generation fail.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: main_tab_practice
- extendedWaitUntil:
    visible:
      id: practice_tab_card_smart_review
    timeout: 20000
- tapOn:
    id: practice_tab_card_smart_review
- extendedWaitUntil:
    visible:
      id: smart_review_practice_tab
    timeout: 20000
- tapOn:
    id: smart_review_start_button
- extendedWaitUntil:
    visible:
      id: "android:id/message"
    timeout: 20000
- takeScreenshot: start-error
- tapOn:
    id: "android:id/button1"
- extendedWaitUntil:
    visible:
      id: smart_review_start_button
    timeout: 10000
- assertVisible:
    id: smart_review_practice_tab
- takeScreenshot: start-error-dismissed
