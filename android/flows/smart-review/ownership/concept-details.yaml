# Smart Review concept row opens the ConceptDetails sheet; back closes it and keeps Main.
# Entry: Home tab. Precondition: debug build with the QA Smart Review fixture (adb shell setprop debug.qa.srdata fixture) or an account with concepts.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: main_tab_practice
- extendedWaitUntil:
    visible:
      id: practice_tab_card_smart_review
    timeout: 20000
- tapOn:
    id: practice_tab_card_smart_review
- extendedWaitUntil:
    visible:
      id: smart_review_practice_tab
    timeout: 20000
- tapOn:
    id: "smart_review_concept_row_.*"
    index: 1
- extendedWaitUntil:
    visible:
      id: smart_review_concept_details_sheet
    timeout: 10000
- takeScreenshot: concept-details
- back
- extendedWaitUntil:
    notVisible:
      id: smart_review_concept_details_sheet
    timeout: 10000
- assertVisible:
    id: smart_review_start_button
- takeScreenshot: concept-details-closed
