# All concepts > concept > details sheet; system Back closes only the sheet and All concepts stays.
# Entry: All concepts. Precondition: a concept row (QA fixture debug.qa.srdata=fixture). Exit: All concepts.
# maestro test -e "CONCEPT=tu eres" sheet-back.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn:
    text: "^${CONCEPT}$"
- extendedWaitUntil:
    visible:
      id: smart_review_concept_details_sheet
    timeout: 10000
- back
- extendedWaitUntil:
    notVisible:
      id: smart_review_concept_details_sheet
    timeout: 10000
- assertVisible:
    id: smart_review_all_concepts_list
- assertNotVisible:
    id: smart_review_mastery_score_page
