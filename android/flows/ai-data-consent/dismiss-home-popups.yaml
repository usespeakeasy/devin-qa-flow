# Home: dismiss the referral promo ("Later") and any Home bottom sheet if they are up. Entry/exit: Home.
# Selectors: the promo has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow:
    when:
      visible: "^Later$"
    commands:
      - tapOn: "^Later$"
# Bottom sheets that open over Home a few seconds after launch (custom courses announcement,
# streak reminder) share the "Close sheet" scrim description; Back closes each one.
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "Close sheet"
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible: "Close sheet"
          commands:
            - back
            - extendedWaitUntil:
                notVisible: "Close sheet"
                timeout: 10000
