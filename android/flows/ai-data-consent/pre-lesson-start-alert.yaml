# AI lesson pre-lesson: tap Start and the AI data consent alert shows over the pre-lesson.
# Entry: pre-lesson (open-free-talk-pre-lesson.yaml), `ai_data_consent_mode` = alert_only, account without the agreement.
# Exit: the alert (ai_data_consent_alert) on screen; answer it with answer-alert.yaml.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn:
    id: ai_lesson_pre_lesson_start
- extendedWaitUntil:
    visible:
      id: ai_data_consent_alert
    timeout: 20000
- assertVisible: "Allow Speak to send your voice and text to AI?"
