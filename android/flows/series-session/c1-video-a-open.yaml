# Case part 1/3 (series video card, QA-only injected into LESSON_ID's first series): open the lesson, the video card plays.
# The runner checks the app has a started audio track before Home.
# Entry: signed in, build with the QA-only `qaWithVideo` loader patch.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-2_mexico_city_survival__requestmedicine__SP"}
  QA_SR: ${QA_SR || "false"}
---
# Part 1 of the background-mid-video case; the runner checks audio state between parts.
- runFlow: open-series.yaml
- extendedWaitUntil:
    visible:
      id: player
    timeout: 30000
- assertVisible:
    id: series_list
