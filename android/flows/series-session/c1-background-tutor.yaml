# Case: line card listening > tutor sheet > background/foreground with the sheet open > Back > the card is paused or
# listening > background/foreground on the card: "Paused" > play: listening again.
# Entry: Home, signed in. Exit: the line card listening (`speak_now_header`), no sheet.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: open-series.yaml
- runFlow: first-line-card.yaml
- tapOn:
    id: "tutor_button_(line|restart)"
- extendedWaitUntil:
    visible:
      id: tutor_everywhere_sheet
    timeout: 20000
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: tutor_everywhere_sheet
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible:
      id: tutor_everywhere_sheet
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "paused_header|speak_now_header"
    timeout: 30000
- runFlow: background-resume.yaml
- extendedWaitUntil:
    visible:
      id: paused_header
    timeout: 15000
- tapOn:
    id: play_line
- extendedWaitUntil:
    visible:
      id: speak_now_header
    timeout: 60000
