# Leagues username sheet: "ab" is rejected by the server with the 3-character error; after OK the sheet
# stays open with "ab", then Back closes it (no name saved).
# Entry: the sheet shows (android/common/open-leagues-username-bridge.yaml), signed in.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: short-name-error-show.yaml
- runFlow: short-name-error-ok.yaml
