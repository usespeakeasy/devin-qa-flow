# Phone speak end of lesson: Skip the schedule CTA, Continue through the remaining steps, land on
# Practice main with the bottom bar. Entry: an end of lesson step. Exit: Practice main.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- repeat:
    times: 6
    while:
      notVisible:
        id: practice_tab_list
    commands:
      - tapOn:
          id: "phone_speak_schedule_skip|primary_button"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: practice_tab_list
    timeout: 30000
- assertVisible:
    id: main_tab_practice
