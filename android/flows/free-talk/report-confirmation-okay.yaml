# Report Confirmation dialog > Okay: the dialog closes and the details sheet is still up.
# Entry: report-spam.yaml.
# Selectors: Okay and Start chatting have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ai_tutor_community_report_confirmation_okay_button
- assertNotVisible:
    id: ai_tutor_community_report_confirmation
- assertVisible:
    id: ai_tutor_community_details_start_chatting_button
- assertVisible:
    id: ai_tutor_community_details_report_text
