# Free Talk tab > Community > tap a topic: the community details sheet opens.
# Entry: cold start (launch-home). Precondition: signed-in dev account. TOPIC is a title on the
# Community Hot list (dev data, e.g. "Espresso vs\\. Latte Art").
# Selectors: the bottom tab, the Community tab, the topic card and the sheet's Start chatting
# button have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/launch-home.yaml
- tapOn: "Free Talk"
# First visit on an account shows the Free Talk intro dialog over the tab.
- runFlow:
    when:
      visible:
        id: ai_tutor_intro_dialog_get_started_button
    commands:
      - tapOn:
          id: ai_tutor_intro_dialog_get_started_button
- assertVisible:
    id: ai_tutor_title
- tapOn: "Community"
- extendedWaitUntil:
    visible:
      id: ai_tutor_community_recycler_view
    timeout: 20000
- extendedWaitUntil:
    visible: ${TOPIC}
    timeout: 20000
- tapOn: ${TOPIC}
- extendedWaitUntil:
    visible:
      id: ai_tutor_community_details_start_chatting_button
    timeout: 10000
- assertVisible:
    id: ai_tutor_community_details_report_text
