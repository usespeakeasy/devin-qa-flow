# Favorites list > TOPIC > details sheet > Start chatting: the sheet closes and the AI lesson
# opens (premium account: the chat, ai_lesson_screen). Exit: on the lesson; the case script presses
# back, confirms Quit and asserts the list.
# Entry: cold start (open-catalog-favorites). Precondition: as open-catalog-favorites, plus
# Debug Menu > Subscription override > Premium.
# Selectors: the topic card and Start chatting have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: open-catalog-favorites.yaml
- tapOn: ${TOPIC}
- extendedWaitUntil:
    visible: "Start chatting"
    timeout: 10000
- tapOn: "Start chatting"
- extendedWaitUntil:
    visible:
      id: ai_lesson_screen
    timeout: 20000
- assertNotVisible: "Start chatting"
