# Community details sheet > "Report this topic." > Spam: the report sheet closes and the
# Report Confirmation dialog shows over the details sheet.
# Entry: open-favorites-topic.yaml or open-community-topic.yaml. Exit: the confirmation dialog.
# Selectors: the report link is a span inside one text node with no resource-id, so a point is
# the only way to hit it (portrait 1080x2400). Spam, Inappropriate content (the report sheet; the
# Navigation 3 sheet has no design_bottom_sheet) and Report Confirmation are text fallbacks.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible: "See something wrong\\? Report this topic\\."
- tapOn:
    point: "69%,71%"
- extendedWaitUntil:
    visible: "^Inappropriate content$"
    timeout: 10000
- tapOn: "^Spam$"
- extendedWaitUntil:
    visible: "Report Confirmation"
    timeout: 15000
- assertNotVisible: "^Inappropriate content$"
- assertVisible: "You've successfully reported this submission\\."
