# Process death during an AI lesson: the system kills the app in the background, relaunch restores
# the lesson screen (or its resume sheet) instead of Home.
# Entry: AI lesson in chat mode. Exit: the restored lesson, Home not showing.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: ai_lesson_resume_sheet|ai_lesson_screen
    timeout: 60000
- runFlow:
    when:
      visible:
        id: ai_lesson_resume_continue
    commands:
      - tapOn:
          id: ai_lesson_resume_continue
- extendedWaitUntil:
    visible:
      id: ai_lesson_screen
    timeout: 30000
- assertNotVisible:
    id: home_root_ready
