# AI lesson transcript > report icon > report options sheet > CATEGORY: the Report problem screen opens.
# Entry: AI lesson in chat mode with a partner message (open-free-talk-scenario.yaml). Exit: the Report problem screen (keyboard up; two backs return to the lesson).
# Selectors: transcript test tags `ai_lesson_transcript_expand_toggle` and `ai_lesson_transcript_report`;
# the options sheet and the Report problem screen have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  CATEGORY: "Content error"
---
- extendedWaitUntil:
    visible:
      id: ai_lesson_transcript_expand_toggle
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: ai_lesson_transcript_report
    commands:
      - tapOn:
          id: ai_lesson_transcript_expand_toggle
- tapOn:
    id: ai_lesson_transcript_report
- extendedWaitUntil:
    visible: "^${CATEGORY}$"
    timeout: 10000
- tapOn: "^${CATEGORY}$"
- extendedWaitUntil:
    visible: "^Report problem$"
    timeout: 20000
- assertVisible: "Any additional details to share\\?"
