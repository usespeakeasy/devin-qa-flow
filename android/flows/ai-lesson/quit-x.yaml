# AI lesson: X, then confirm quit on a regular lesson (not a custom unit's): the lesson closes to the
# abandon feedback screen or to where it started, with no difficulty check-in.
# Entry: AI lesson (open-free-talk-scenario.yaml), `debug.qa.unit_no` unset. Exit: off the lesson.
# Selectors: the X has no resource-id (point fallback 7%,8%, as in quit-x-check-in.yaml).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    visible:
      id: ai_lesson_quit_sheet
    timeout: 10000
- tapOn:
    id: ai_lesson_quit_confirm
# A regular lesson leaves to the abandon feedback screen or back to where it started; the case script dumps which.
- extendedWaitUntil:
    notVisible:
      id: ai_lesson_quit_sheet
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: ai_lesson_screen
    timeout: 20000
- assertNotVisible:
    id: custom_units_difficulty_check_in_just_right
