# After process death on the AI lesson pre-lesson (`AiLessonFlowStep.PreAiLesson` in the `Destination.AiLesson`
# flow): the pre-lesson comes back for the same topic (TOPIC text), and Start still opens the lesson (the flow's
# mediator, rebuilt after the kill, loads it from the flow root's args). Entry: relaunch after the harness killed
# the backgrounded app (`am kill`) on the pre-lesson (open-free-talk-pre-lesson.yaml).
# Exit: AI lesson (ai_lesson_screen). Saves SHOT-pre.png and SHOT-lesson.png.
# maestro test -e TOPIC="카페에서" restored-pre-lesson-start.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "restored"}
---
- extendedWaitUntil:
    visible:
      id: ai_lesson_pre_lesson_start
    timeout: 60000
- assertVisible: ${TOPIC}
- assertNotVisible:
    id: home_root_ready
- takeScreenshot: ${SHOT}-pre
- tapOn:
    id: ai_lesson_pre_lesson_start
- runFlow:
    when:
      visible:
        id: ai_data_consent_alert
    commands:
      - tapOn:
          id: ai_data_consent_alert_allow
- runFlow: enter-from-pre-lesson.yaml
- takeScreenshot: ${SHOT}-lesson
