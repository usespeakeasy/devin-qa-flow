# Report problem screen over an AI lesson > Back (keyboard), Back: the screen closes and the lesson shows again.
# Entry: report-category.yaml exit (Report problem screen, keyboard up). Exit: the AI lesson, no report screen.
# Selectors: text fallback "Report problem" for builds before `report_screen` (on develop since #8774).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- hideKeyboard
- runFlow:
    when:
      visible: "Report problem"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: ai_lesson_screen
    timeout: 15000
- assertNotVisible: "Report problem"
