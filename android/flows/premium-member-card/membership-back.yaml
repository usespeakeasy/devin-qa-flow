# Manage Membership: system back returns to Settings, a second back returns to Profile.
# Entry: Manage Membership (member_card). Exit: Profile tab.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- back
- extendedWaitUntil:
    visible:
      id: settings_manage_membership_option
    timeout: 10000
- assertNotVisible:
    id: member_card
- back
- extendedWaitUntil:
    visible:
      id: action_settings
    timeout: 10000
