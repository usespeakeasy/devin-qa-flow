# Profile > Settings > Manage membership > Get Subscription History (`item_request_certificate`): the certificate
# dialog. Back and a tap outside leave it open. ACTION: cancel (Cancel closes it), cancel_double, request (Request,
# the result shows in the same dialog, OK closes it), request_double (double tap Request, then double tap OK), none.
# Manage membership must still show afterwards. Entry: signed in (restarts the app) as a paid (not trial) premium account.
# Exit: Manage membership, or the open dialog for none. Saves SHOT.png (dialog) and SHOT_result.png (request).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "certificate"}
  ACTION: ${ACTION || "cancel"}
---
- launchApp:
    stopApp: true
- runFlow: ../launch/home-ready-after-launch.yaml
- runFlow:
    file: ../settings/open-manage-membership.yaml
    env:
      SHOT: ${SHOT}_membership
- scrollUntilVisible:
    element:
      id: item_request_certificate
    direction: DOWN
    timeout: 15000
- tapOn:
    id: item_request_certificate
- extendedWaitUntil:
    visible:
      id: request_certificate_submit_button
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
- back
- waitForAnimationToEnd
- assertVisible:
    id: request_certificate_submit_button
- tapOn:
    point: 50%, 4%
- waitForAnimationToEnd
- assertVisible:
    id: request_certificate_submit_button
- runFlow:
    when:
      true: ${ACTION == "cancel"}
    commands:
      - tapOn:
          id: request_certificate_cancel_button
- runFlow:
    when:
      true: ${ACTION == "cancel_double"}
    commands:
      - doubleTapOn:
          id: request_certificate_cancel_button
- runFlow:
    when:
      true: ${ACTION == "request" || ACTION == "request_double"}
    commands:
      - runFlow:
          when:
            true: ${ACTION == "request"}
          commands:
            - tapOn:
                id: request_certificate_submit_button
      - runFlow:
          when:
            true: ${ACTION == "request_double"}
          commands:
            - doubleTapOn:
                id: request_certificate_submit_button
      - extendedWaitUntil:
          visible:
            id: request_certificate_result_ok_button
          timeout: 20000
      - assertVisible:
          id: request_certificate_dialog
      - waitForAnimationToEnd
      - takeScreenshot: ${SHOT}_result
      - back
      - assertVisible:
          id: request_certificate_result_ok_button
      - runFlow:
          when:
            true: ${ACTION == "request"}
          commands:
            - tapOn:
                id: request_certificate_result_ok_button
      - runFlow:
          when:
            true: ${ACTION == "request_double"}
          commands:
            - doubleTapOn:
                id: request_certificate_result_ok_button
- runFlow:
    when:
      true: ${ACTION != "none"}
    commands:
      - extendedWaitUntil:
          notVisible:
            id: request_certificate_dialog
          timeout: 5000
      - waitForAnimationToEnd
      - assertVisible:
          id: item_see_all_subscriptions
