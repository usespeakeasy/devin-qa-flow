# Onboarding route (Spanish) > sign-in options > "Continue with Phone" > phone code entry
# (`otp_sign_in_entry_screen`). Stops before typing. Needs `sms_otp_enabled` served or ON.
# Entry: app data cleared (`qa_android.py fresh`), `onboarding_storybook_screen` on screen.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: onboarding-spanish-sign-in-options.yaml
- extendedWaitUntil:
    visible:
      id: auth_options_phone_otp_button
    timeout: 15000
- tapOn:
    id: auth_options_phone_otp_button
- extendedWaitUntil:
    visible:
      id: otp_sign_in_entry_screen
    timeout: 15000
