# Phone code sign-in from the signed-out storybook to Home: Continue with Phone, number, Send code, code, Verify.
# Needs a Speak session with `sms_otp_enabled` ON and a phone whose code is known (the backend's static
# reviewer code, e.g. on api.usespeak-dev.cn). Entry: `onboarding_storybook_sign_in_button`.
# Params (run time only): PHONE in E.164 (the field switches country from the dialed prefix), CODE.
# Selectors: "Continue with Phone" has no resource-id yet (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: open-phone-sign-in.yaml
- tapOn: "Continue with Phone"
- extendedWaitUntil:
    visible:
      id: otp_sign_in_entry_screen
    timeout: 15000
- tapOn:
    id: otp_sign_in_destination_field
- inputText: ${PHONE}
- tapOn:
    id: otp_sign_in_send_code_button
- extendedWaitUntil:
    visible:
      id: otp_sign_in_code_screen
    timeout: 30000
- tapOn:
    id: otp_sign_in_code_field
- inputText: ${CODE}
- runFlow:
    when:
      visible:
        id: otp_sign_in_verify_button
        enabled: true
    commands:
      - tapOn:
          id: otp_sign_in_verify_button
- extendedWaitUntil:
    visible:
      id: (home_root_ready|onboarding_premium_intro_(ready|error)|main-editor-container|design_bottom_sheet)
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: home_root_ready
    commands:
      - runFlow: ../../common/dismiss-premium-intro.yaml
- assertVisible:
    id: home_root_ready
