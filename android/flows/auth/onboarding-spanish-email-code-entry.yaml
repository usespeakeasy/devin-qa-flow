# Onboarding route (Spanish) > sign-in options > "Continue with Email Code" > email code entry
# (`otp_sign_in_entry_screen`). Stops before typing; follow with send-otp-code.yaml and verify-otp-code.yaml.
# Needs a Speak session with `email_otp_enabled` ON or served ON.
# Entry: app data cleared (`qa_android.py fresh`), `onboarding_storybook_screen` on screen.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: onboarding-spanish-sign-in-options.yaml
- extendedWaitUntil:
    visible:
      id: auth_options_email_otp_button
    timeout: 15000
- tapOn:
    id: auth_options_email_otp_button
- extendedWaitUntil:
    visible:
      id: otp_sign_in_entry_screen
    timeout: 15000
