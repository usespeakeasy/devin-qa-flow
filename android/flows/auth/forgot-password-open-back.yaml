# Email sign-in form > "Forgot your password?" > reset form: type EMAIL in the reset email field (not sent),
# then Back returns to the sign-in form with its email and password fields.
# Entry: `onboarding_sign_in_screen` (after common/open-email-sign-in.yaml). Exit: `onboarding_sign_in_screen`.
# Selectors: release/4.73.0 `1a5edcc328` has no ids on the reset form (text fallback "Reset your password", "Email");
# develop `68bc5399c6` has `onboarding_forgot_password_*`.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn:
    id: onboarding_sign_in_forgot_password_button
- extendedWaitUntil:
    visible: "Reset your password"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: onboarding_forgot_password_email_field
    commands:
      - tapOn:
          id: onboarding_forgot_password_email_field
- runFlow:
    when:
      notVisible:
        id: onboarding_forgot_password_email_field
    commands:
      - tapOn: "Email"
- inputText: ${EMAIL}
# The field capitalizes the first letter, so match case-insensitively and literally.
- assertVisible: "(?i)\\Q${EMAIL}\\E"
- assertVisible: "Submit"
# Back closes the keyboard first; a second Back closes the reset sheet.
- back
- runFlow:
    when:
      visible: "Reset your password"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: onboarding_sign_in_screen
    timeout: 15000
- assertVisible:
    id: onboarding_sign_in_email_field
- assertVisible:
    id: onboarding_sign_in_password_field
