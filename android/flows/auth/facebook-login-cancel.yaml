# Facebook login page (opened by facebook-sign-in-opens.yaml) > Chrome's Close tab (X) cancels the login: the app is back on
# the auth options sheet, still signed out, with no loader and no error (the SDK reports a cancel, not a failure).
# Entry: Facebook login page on screen (Chrome Custom Tab on m.facebook.com, or the SDK's web dialog) after
# "Continue with Facebook" on the sign-in or sign-up options sheet.
# Selectors: `close_button` is Chrome's Custom Tab toolbar X.
# Exit: `auth_options_screen` visible, no `auth_options_loading`, no `auth_options_error`, no generic error dialog.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
# System Back on the m.facebook.com page only closes Facebook's "Already logged in on another Meta app?" sheet and
# stays in the tab (develop d9ee37a46e, API 36), so the flow uses Close tab, the cancel a user sees.
- tapOn:
    id: close_button
- extendedWaitUntil:
    visible:
      id: auth_options_screen
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible:
    id: auth_options_loading
- assertNotVisible:
    id: auth_options_error
- assertNotVisible: "An unexpected error occurred\\."
- assertNotVisible:
    id: home_root_ready
