# Email sign-in from the signed-out storybook: Log in > Continue with Email > EMAIL and PASSWORD > Sign in.
# Ends at the sign-in tap, before the auth screen exits, so the run script can press Home, kill the process or wait.
# Entry: `onboarding_storybook_sign_in_button` (after `qa_android.py fresh` or a log out). Params (run time only): EMAIL, PASSWORD.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow: ../../common/submit-email-sign-in.yaml
