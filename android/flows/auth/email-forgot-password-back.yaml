# Signed-out storybook > Log in > Email > Forgot password > Back returns to the sign-in form.
# Entry: app data cleared. Params: EMAIL (typed into the reset field, not sent).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow: forgot-password-open-back.yaml
