# Signed-out welcome screen > Log in > sign-in options sheet shows "Continue with Phone" (Speak session,
# `sms_otp_enabled` ON or served ON), e.g. on chinaDevelopDebug. Stops on the options sheet.
# Entry: app data cleared, storybook on screen.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_sign_in_button
    timeout: 60000
- tapOn:
    id: onboarding_storybook_sign_in_button
- extendedWaitUntil:
    visible:
      id: auth_options_screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: auth_options_phone_otp_button
    timeout: 15000
