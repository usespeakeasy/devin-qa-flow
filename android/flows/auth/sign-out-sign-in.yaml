# Settings -> Log out -> confirm lands on the welcome screen; email sign-in reaches Home again.
# Entry: `home_root_ready`. Params: EMAIL, PASSWORD (run time only).
# Selectors: "Log out" row and the confirm dialog have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/open-settings.yaml
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
- tapOn: "Log out"
- assertVisible: "Are you sure you want to sign out\\?"
- tapOn:
    text: "Log out"
    below: "Are you sure you want to sign out\\?"
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_sign_in_button
    timeout: 30000
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow: ../../common/submit-email-sign-in.yaml
- runFlow: ../../common/dismiss-premium-intro.yaml
