# China phone sign-up entry still shows the China consent checkbox; Send code needs text AND the tick.
# Entry: sign-up options sheet. VALUE: a national phone number. Stops before sending.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn:
    id: auth_options_phone_otp_button
- extendedWaitUntil:
    visible:
      id: otp_sign_in_entry_screen
    timeout: 15000
- assertVisible:
    id: otp_sign_in_china_consent_checkbox
- assertVisible: ".*I have read and agree to the User Agreement, Privacy Policy, and Cross-Border Data Transfer Statement.*"
- tapOn:
    id: otp_sign_in_destination_field
- inputText: ${VALUE}
- hideKeyboard
- assertVisible:
    id: otp_sign_in_send_code_button
    enabled: false
- tapOn:
    id: otp_sign_in_china_consent_checkbox
- assertVisible:
    id: otp_sign_in_send_code_button
    enabled: true
