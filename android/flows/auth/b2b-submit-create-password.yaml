# B2B access Create Password: type a password and tap Create password. Ends right after the tap,
# so the case script can force-stop mid-activation or wait for the next screen itself.
# Entry: signed out, Create Password ("One last step") opened by a speak-dev://b2b-access link
# for a seeded seat whose address has no Speak account. PASSWORD at run time (8+ chars, a letter, a digit).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      text: "One last step"
    timeout: 30000
- tapOn:
    text: "Create a password"
- inputText: ${PASSWORD}
- hideKeyboard
- assertVisible:
    text: "^Create password$"
    enabled: true
- tapOn:
    text: "^Create password$"
