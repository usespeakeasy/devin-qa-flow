# Cold start while signed in with the network off: the app stays signed in and shows the offline screen.
# Entry: signed in. To force a session refresh, the run script first turns off automatic date and time and moves
# the device clock ahead (adb, not Maestro). Exit: airplane mode still on; back-online-refresh.yaml undoes it.
# Selectors: the offline screen has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "You.re offline"
    timeout: 60000
- assertNotVisible:
    id: onboarding_storybook_sign_in_button
