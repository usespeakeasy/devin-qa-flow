# Settings -> Log out -> confirm -> signed-out storybook. Entry: `home_root_ready`.
# Selectors: the confirm dialog has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings_log_out_option
    direction: DOWN
- tapOn:
    id: settings_log_out_option
- assertVisible: "Are you sure you want to sign out\\?"
- tapOn:
    text: "Log out"
    below: "Are you sure you want to sign out\\?"
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_screen
    timeout: 30000
