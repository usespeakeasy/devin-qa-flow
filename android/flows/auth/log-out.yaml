# Settings -> Log out -> confirm -> signed-out storybook. Entry: `home_root_ready`.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings_log_out_option
    direction: DOWN
- tapOn:
    id: settings_log_out_option
- extendedWaitUntil:
    visible:
      id: simple_dialog
    timeout: 10000
- tapOn:
    id: simple_dialog_positive_button
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_screen
    timeout: 30000
