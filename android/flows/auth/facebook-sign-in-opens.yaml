# Sign-in options > "Continue with Facebook" opens the Facebook login page (Chrome Custom Tab on
# m.facebook.com when the Facebook app isn't installed). Stops on the page; the caller backs out.
# Entry: sign-in options sheet with "Continue with Facebook". Chrome's first-run screen already dismissed.
# Selectors: the Facebook button has no resource-id (text fallback); `url_bar` is Chrome's.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- tapOn: "Continue with Facebook"
- extendedWaitUntil:
    visible:
      id: url_bar
      text: ".*facebook\\.com.*"
    timeout: 30000
