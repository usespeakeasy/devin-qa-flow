# Email sign-in: wrong password shows the inline error, then the right password reaches Home
# (premium intro dismissed on the way).
# Entry: app data cleared. Params: EMAIL, PASSWORD (run time only).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- launchApp:
    stopApp: true
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow:
    file: ../../common/submit-email-sign-in.yaml
    env:
      PASSWORD: wrong
- extendedWaitUntil:
    visible:
      id: onboarding_sign_in_error
    timeout: 30000
- assertVisible:
    id: onboarding_sign_in_screen
- runFlow: ../../common/retry-password.yaml
- runFlow: ../../common/dismiss-premium-intro.yaml
