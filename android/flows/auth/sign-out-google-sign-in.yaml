# Settings -> Log out -> confirm lands on the welcome screen; Google sign-in reaches Home again.
# Entry: `home_root_ready`, signed in with Google. Precondition: as google-sign-in.yaml.
# Selectors: the confirm dialog has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings_log_out_option
    direction: DOWN
- tapOn:
    id: settings_log_out_option
- assertVisible: "Are you sure you want to sign out\\?"
- tapOn:
    text: "Log out"
    below: "Are you sure you want to sign out\\?"
- runFlow: ../../common/open-google-sign-in.yaml
