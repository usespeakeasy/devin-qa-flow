# Email sign-in form > "Forgot your password?" > reset form: type EMAIL, tap Submit. The request finishes with no
# error (no `onboarding_forgot_password_error`, no loading). The confirmation is a Toast ("Password reset email
# sent to <EMAIL>. Check your email!"), which Maestro often misses on a slow emulator, so its wait is optional and
# the run checks the toast in the recording. Back returns to the
# sign-in form with its email and password fields. SHOT names the screenshot taken with the toast up.
# Entry: `onboarding_sign_in_screen` (after common/open-email-sign-in.yaml), empty fields. Dev or prod.
# Params (run time only): EMAIL, an address of an existing account the run created.
# Exit: `onboarding_sign_in_screen`.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "forgot-password-sent"}
---
- tapOn:
    id: onboarding_sign_in_forgot_password_button
- extendedWaitUntil:
    visible:
      id: onboarding_forgot_password_screen
    timeout: 15000
- tapOn:
    id: onboarding_forgot_password_email_field
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: onboarding_forgot_password_submit_button
- extendedWaitUntil:
    visible: "Password reset email sent to .*"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: onboarding_forgot_password_loading
    timeout: 20000
- takeScreenshot: ${SHOT}
- assertNotVisible:
    id: onboarding_forgot_password_error
- assertVisible:
    id: onboarding_forgot_password_screen
- back
- runFlow:
    when:
      visible:
        id: onboarding_forgot_password_screen
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: onboarding_sign_in_screen
    timeout: 15000
- assertVisible:
    id: onboarding_sign_in_email_field
- assertVisible:
    id: onboarding_sign_in_password_field
