# Debug Menu demo "Challenge tab with leaderboard (Compose)" (DemoChallengeTabWithLeaderboardKey) by
# speak-dev://demos?id=challenge-tab-leaderboard: opens on Leagues, the Leaderboard page loads ORG_NAME,
# Leagues shows LEAGUES_ID again, and Back returns to the Demos list.
# Entry: signed in (cold starts). Precondition: an organization account or the QA-only
# debug.qa.org_leaderboard=1 patch (organization "QA Org"). Pass LEAGUES_ID with -e
# (placeholder_join_button when Leagues is locked). Exit: the Demos list.
# Selectors: page tabs by text (their test tags are not in the tree, CLNT-1280); ORG_NAME and the Demos row title are text (the Demos rows have no ids).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  ORG_NAME: ${ORG_NAME || "QA Org"}
---
- runFlow:
    file: ../debug-demos/nav-demo-link.yaml
    env:
      DEMO_ID: challenge-tab-leaderboard
      ROOT_TEXT: "^Leaderboard$"
- extendedWaitUntil:
    visible:
      id: ${LEAGUES_ID}
    timeout: 30000
- assertVisible:
    text: "^Leaderboard$"
- tapOn:
    text: "^Leaderboard$"
- extendedWaitUntil:
    visible: ".*${ORG_NAME}.*"
    timeout: 20000
- tapOn:
    text: "^Leagues$"
- extendedWaitUntil:
    visible:
      id: ${LEAGUES_ID}
    timeout: 30000
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_tab_screen
    timeout: 15000
# The Demos list comes back scrolled to the top, so scroll to the demo's row.
- scrollUntilVisible:
    element:
      text: "^Challenge tab with leaderboard \\(Compose\\)$"
    timeout: 30000
