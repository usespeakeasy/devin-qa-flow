# Completed > a previous challenge, rotate to landscape and back: the details card stays open both times, then
# Back closes it. Needs tablet emulation (SpeakActivity is portrait-locked on phones).
# Entry: Challenges list. Precondition: account with a completed challenge. Exit: Completed list, portrait.
# Saves SHOT_landscape.png and SHOT_portrait.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "previous-details-rotate"}
---
- tapOn:
    id: challenges_completed_button
- extendedWaitUntil:
    visible:
      id: challenge_previous_card
    timeout: 20000
- tapOn:
    id: challenge_previous_card
    index: 0
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- takeScreenshot: ${SHOT}_landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- takeScreenshot: ${SHOT}_portrait
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_previous_details_card
    timeout: 5000
- assertVisible:
    id: challenge_previous_card
