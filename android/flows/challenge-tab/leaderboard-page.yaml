# Challenge tab > Leaderboard page: the organization leaderboard loads and shows ORG_NAME.
# Entry: any Main tab. Precondition: Leagues on, account in an organization (or the QA-only
# debug.qa.org_leaderboard=1 patch, organization "QA Org"). Exit: Leaderboard page.
# Selectors: page tabs by text (their test tags are not in the tree, CLNT-1280); the Leaderboard page content has no resource-id (ORG_NAME text is the check).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  ORG_NAME: ${ORG_NAME || "QA Org"}
  SHOT: ${SHOT || "leaderboard-page"}
---
- tapOn:
    id: main_tab_challenges
- extendedWaitUntil:
    visible:
      text: "^Leaderboard$"
    timeout: 20000
- assertVisible:
    text: "^Leagues$"
- assertVisible:
    text: "^Challenges$"
- tapOn:
    text: "^Leaderboard$"
- extendedWaitUntil:
    visible: ".*${ORG_NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}
