# Completed > a previous challenge: the details card opens; a tap on the card keeps it open, a tap outside
# (point 50%,10%) closes it, and after reopening Back closes it. Entry: Challenges list. Precondition: account
# with a completed challenge. Exit: Completed list. Saves SHOT_open.png, SHOT_card_tap.png, SHOT_outside.png, SHOT_closed.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "previous-details-dismiss"}
---
- tapOn:
    id: challenges_completed_button
- extendedWaitUntil:
    visible:
      id: challenge_previous_card
    timeout: 20000
- tapOn:
    id: challenge_previous_card
    index: 0
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}_open
- tapOn:
    id: challenge_previous_details_card
- waitForAnimationToEnd
- assertVisible:
    id: challenge_previous_details_card
- takeScreenshot: ${SHOT}_card_tap
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    notVisible:
      id: challenge_previous_details_card
    timeout: 5000
- assertVisible:
    id: challenge_previous_card
- takeScreenshot: ${SHOT}_outside
- tapOn:
    id: challenge_previous_card
    index: 0
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- waitForAnimationToEnd
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_previous_details_card
    timeout: 5000
- assertVisible:
    id: challenge_previous_card
- takeScreenshot: ${SHOT}_closed
