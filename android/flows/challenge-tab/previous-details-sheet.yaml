# Completed > a previous challenge: its details sheet opens; Back closes it and the Completed list stays.
# Entry: Challenges list. Precondition: account with a completed challenge. Exit: Completed list.
# Saves SHOT.png (sheet).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "previous-details"}
---
- tapOn:
    id: challenges_completed_button
- extendedWaitUntil:
    visible:
      id: challenge_previous_card
    timeout: 20000
- tapOn:
    id: challenge_previous_card
    index: 0
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- takeScreenshot: ${SHOT}
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_previous_details_card
    timeout: 15000
- assertVisible:
    id: challenge_previous_card
- tapOn:
    id: challenges_active_button
