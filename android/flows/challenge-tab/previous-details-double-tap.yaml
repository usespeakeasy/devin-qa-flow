# Completed > fast double tap on a previous challenge: one details card opens, and one Back closes it to the
# Completed list (no second card left over). Entry: Challenges list. Precondition: account with a completed challenge.
# Exit: Completed list. Saves SHOT_open.png and SHOT_closed.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "previous-details-double-tap"}
---
- tapOn:
    id: challenges_completed_button
- extendedWaitUntil:
    visible:
      id: challenge_previous_card
    timeout: 20000
- doubleTapOn:
    id: challenge_previous_card
    index: 0
- extendedWaitUntil:
    visible:
      id: challenge_previous_details_card
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}_open
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_previous_details_card
    timeout: 5000
- assertVisible:
    id: challenge_previous_card
- takeScreenshot: ${SHOT}_closed
