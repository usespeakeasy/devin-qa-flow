# Debug Menu demo "Challenge overview (Compose)" (DEMO_ID challenge-overview, DemoChallengeOverviewKey) or the
# embedded one (DEMO_ID challenge-overview-embedded) by speak-dev://demos?id=DEMO_ID: the overview renders with its
# Active list and a card, then Back returns to the Demos list showing ROW. Entry: signed in (cold starts).
# Precondition: an active challenge (QA-only patch on dev). Exit: Demos list. Saves SHOT.png.
# Selectors: the Demos row title is text (the Demos rows have no ids).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "demo-overview"}
---
- runFlow:
    file: ../debug-demos/nav-demo-link.yaml
    env:
      DEMO_ID: ${DEMO_ID}
      ROOT_TEXT: ".*"
- extendedWaitUntil:
    visible:
      id: challenges_active_button
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: challenge_overview_card
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
- back
- extendedWaitUntil:
    notVisible:
      id: challenges_active_button
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${ROW}
    timeout: 30000
