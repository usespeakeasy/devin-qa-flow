# From a lesson or pre-lesson opened from the activity log: system Back (Quit when the quit sheet shows) returns to the
# activity log. Entry: lesson or pre-lesson. Exit: activity_log_screen.
# Selectors: the quit sheet has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- back
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Are you sure you want to quit this lesson\\?"
    commands:
      - tapOn: "^Quit$"
- extendedWaitUntil:
    visible:
      id: activity_log_screen
    timeout: 20000
- assertNotVisible:
    id: "drill_lesson_root|ai_lesson_pre_lesson_screen"
