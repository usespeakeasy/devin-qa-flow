# Series lesson by deep link from Home (resume prompt answered Start over), tap forward TAPS cards so the lesson has
# saved progress, then system Back > Quit on the close sheet > Home. The caller reads the card it left on with harness
# dump before this flow quits (run with PHASE=open first, then PHASE=quit).
# Entry: Home, signed in. Exit: PHASE=open the series card TAPS cards in; PHASE=quit Home.
# Selectors: the close sheet has no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
  TAPS: ${TAPS || "3"}
  PHASE: ${PHASE || "open"}
  SHOT: ${SHOT || "series-progress"}
---
- runFlow:
    when:
      true: ${PHASE == 'open'}
    commands:
      - runFlow: ../series-session/open-series.yaml
      - runFlow:
          file: ../series-render/tap-forward.yaml
          env:
            TAPS: ${TAPS}
      - extendedWaitUntil:
          visible:
            id: "speak_now_header|tap_to_continue"
          timeout: 30000
      - takeScreenshot: ${SHOT}
- runFlow:
    when:
      true: ${PHASE == 'quit'}
    commands:
      - runFlow: ../series-nav3/back-confirm-home.yaml
