# Learning LEARNING -> native NATIVE that matches the app language (English): no app language sheet, onboarding goes
# on to the "Create an account" options in English. Learning English has no English native option, so the default
# learns Japanese with native English (`english_japanese`).
# Entry: `onboarding_language_screen` (learning step) on screen, signed out, app in English. Exit: `auth_options_screen`.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LEARNING: ${LEARNING || "ja_jp"}
  NATIVE: ${NATIVE || "english_japanese"}
---
- extendedWaitUntil:
    visible:
      id: onboarding_language_option_${LEARNING}
    timeout: 30000
- tapOn:
    id: onboarding_language_option_${LEARNING}
- runFlow:
    when:
      visible:
        id: onboarding_language_continue_button
    commands:
      - tapOn:
          id: onboarding_language_continue_button
- extendedWaitUntil:
    visible:
      id: onboarding_language_option_${NATIVE}
    timeout: 30000
- tapOn:
    id: onboarding_language_option_${NATIVE}
- runFlow:
    when:
      visible:
        id: onboarding_language_continue_button
    commands:
      - tapOn:
          id: onboarding_language_continue_button
- extendedWaitUntil:
    visible:
      id: auth_options_screen
    timeout: 30000
- assertNotVisible:
    id: onboarding_app_language_sheet
- assertVisible:
    text: "Continue with Email"
