# Learning language step -> Spanish -> "Create an account" options sheet.
# Entry: `onboarding_language_screen` on screen, signed out. After Back from the sheet the step
# keeps Spanish selected and shows Continue; the flow taps it then.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: onboarding_language_option_es_mx
- runFlow:
    when:
      visible:
        id: onboarding_language_continue_button
    commands:
      - tapOn:
          id: onboarding_language_continue_button
- extendedWaitUntil:
    visible:
      id: auth_options_screen
    timeout: 30000
