# Storybook > Get started > learning English > native Korean > keep English > sign-up options sheet
# (`auth_options_screen`) in the Korean flow. Stops there so the run script can assert the providers
# (Kakao shows in the Korean flow on global builds only).
# Entry: app data cleared, storybook on screen.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_get_started_button
    timeout: 60000
- tapOn:
    id: onboarding_storybook_get_started_button
- extendedWaitUntil:
    visible:
      id: onboarding_language_screen
    timeout: 30000
- runFlow:
    file: open-app-language-sheet.yaml
    env:
      NATIVE: korean_english
- tapOn:
    id: onboarding_app_language_keep_button
- extendedWaitUntil:
    visible:
      id: auth_options_screen
    timeout: 30000
