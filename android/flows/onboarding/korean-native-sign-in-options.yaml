# Korean native language onboarding > sign-up options > "Already have an account? Log in" > sign-in options
# (`auth_options_screen`) in the Korean flow. Stops there so the run script can assert the providers
# (Kakao and Naver show in the Korean flow on global builds only).
# Entry: app data cleared, storybook on screen.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: korean-native-sign-up-options.yaml
- tapOn:
    id: auth_options_secondary_text_button
- extendedWaitUntil:
    visible: "Sign in to continue"
    timeout: 15000
- assertVisible:
    id: button_email
