# Signed-out storybook -> two fast taps on Get started -> Back while the language check's progress
# dialog shows -> Get started again if the storybook is back -> learning language step.
# Entry: `onboarding_storybook_screen` on screen, signed out. Pass OUT=<dir> for the dialog screenshot.
# The "Run flow when id: indicator is visible" line says whether the progress dialog showed.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  OUT: .
---
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_get_started_button
    timeout: 60000
- tapOn:
    id: onboarding_storybook_get_started_button
    repeat: 2
    delay: 150
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      visible:
        id: indicator
    commands:
      - takeScreenshot: ${OUT}/c10_dialog
      - back
- runFlow:
    when:
      visible:
        id: onboarding_storybook_get_started_button
    commands:
      - tapOn:
          id: onboarding_storybook_get_started_button
          waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: onboarding_language_screen
    timeout: 30000
