# Signed-out storybook: swipe left through the 3 pages and back right once. The storybook stays on screen
# and the main button stays (it shows on every page). Pages also advance by themselves.
# Entry: app data cleared, `onboarding_storybook_screen` on screen. Exit: the storybook.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      id: onboarding_storybook_get_started_button
    timeout: 60000
- repeat:
    times: 2
    commands:
      - swipe:
          direction: LEFT
      - assertVisible:
          id: onboarding_storybook_screen
- swipe:
    direction: RIGHT
- assertVisible:
    id: onboarding_storybook_get_started_button
- assertVisible:
    id: onboarding_storybook_sign_in_button
