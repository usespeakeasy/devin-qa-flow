# Full-screen sign-up options -> Continue with Email -> EMAIL and PASSWORD -> ticks Accept All when the consent list
# shows (Korean flow), else the AI data consent row when it shows -> Sign up -> notification prompt (allowed when shown) -> onboarding chat ready.
# Entry: `auth_options_screen` (sign-up). Pass a throwaway account at run time (never commit it):
# maestro test -e EMAIL=$(qa_android.py newuser) -e PASSWORD=... email-sign-up-to-chat.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- runFlow: open-email-sign-up-form.yaml
- runFlow:
    when:
      visible:
        id: onboarding_sign_up_consent_all
    commands:
      - tapOn:
          id: onboarding_sign_up_consent_all
- runFlow:
    when:
      notVisible:
        id: onboarding_sign_up_consent_all
      visible:
        id: onboarding_sign_up_consent_ai_data
    commands:
      - tapOn:
          id: onboarding_sign_up_consent_ai_data
- runFlow: submit-sign-up.yaml
- extendedWaitUntil:
    visible:
      id: permission_allow_button
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: permission_allow_button
    commands:
      - tapOn:
          id: permission_allow_button
- extendedWaitUntil:
    visible:
      id: onboarding_magic_ready
    timeout: 60000
