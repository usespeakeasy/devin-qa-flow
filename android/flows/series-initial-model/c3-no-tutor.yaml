# Case: tutor_everywhere_series_lessons_enabled off (OFF override, or SERVER serving off): a series lesson opened from
# Home loads to a listening line card with no tutor button. Entry: Home. Exit: the line card.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- runFlow:
    file: ../series-session/open-series.yaml
    env:
      LESSON_ID: ${LESSON_ID}
- runFlow: assert-no-tutor.yaml
