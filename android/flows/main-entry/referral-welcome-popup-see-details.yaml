# Referral Welcome as a Main popup on a Home cold start (active referral, `referrals` flag on): "See details" opens
# the referral screen (referral_screen); Back returns to Main with the bar.
# Entry: any; needs the popup due (QA build: `setprop debug.qa.popup referral`). Exit: Main. Saves SHOT-dialog.png and SHOT.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "referral-welcome-popup"}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: referral_welcome_dialog_root
    timeout: 60000
- takeScreenshot: ${SHOT}-dialog
- back
- assertVisible:
    id: referral_welcome_dialog_root
- tapOn:
    id: referral_welcome_dialog_see_details_button
- extendedWaitUntil:
    visible:
      id: referral_screen
    timeout: 20000
- assertNotVisible:
    id: referral_welcome_dialog_root
- takeScreenshot: ${SHOT}
- back
- extendedWaitUntil:
    visible:
      id: main_tab_home
    timeout: 20000
- assertNotVisible:
    id: referral_screen
