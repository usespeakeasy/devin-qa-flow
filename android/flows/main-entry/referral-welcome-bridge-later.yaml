# Debug Menu > Dialog Bridges > "Referral Welcome": Back and a tap outside the dialog don't close it; "Later" does.
# (`Destination.ReferralWelcome` Navigation 3 entry, or the bridge controller with the kill switch ON.)
# Entry: signed in, any state (restarts the app). Exit: Dialog Bridges list. Saves SHOT.png (the dialog after Back and the outside tap).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
  SHOT: ${SHOT || "referral-welcome-bridge"}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 60000
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible:
      id: debug_menu_screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: debug_menu_dialog_bridges
    direction: DOWN
    timeout: 20000
- tapOn:
    id: debug_menu_dialog_bridges
- scrollUntilVisible:
    element:
      id: debug_dialog_bridges_referral_welcome
    direction: DOWN
    timeout: 30000
- tapOn:
    id: debug_dialog_bridges_referral_welcome
- extendedWaitUntil:
    visible:
      id: referral_welcome_dialog_root
    timeout: 15000
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: referral_welcome_dialog_root
# Outside tap: the top edge of the screen, above the centered dialog.
- tapOn:
    point: 50%,3%
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: referral_welcome_dialog_root
- takeScreenshot: ${SHOT}
- tapOn:
    id: referral_welcome_dialog_later_button
- extendedWaitUntil:
    notVisible:
      id: referral_welcome_dialog_root
    timeout: 10000
- assertVisible:
    id: debug_dialog_bridges_referral_welcome
