# Tap one magic wand on the Create/Edit screen (FIELD=user_role, ai_role or scenario), answer the AI data
# consent alert with Allow if it shows, and wait until the scene field no longer shows OLD_SCENARIO.
# The case script then asserts which fields kept the typed text (assert-create-fields.yaml).
# Entry/exit: Create or Edit screen with text in the fields.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  FIELD: ${FIELD || "scenario"}
  OLD_SCENARIO: ${OLD_SCENARIO || ""}
---
# The wand only shows on the focused field.
- tapOn:
    id: ai_tutor_create_community_input_${FIELD}
- extendedWaitUntil:
    visible:
      id: ai_tutor_create_community_input_${FIELD}_magic_button
    timeout: 5000
- tapOn:
    id: ai_tutor_create_community_input_${FIELD}_magic_button
- extendedWaitUntil:
    visible:
      id: ai_data_consent_alert
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        id: ai_data_consent_alert
    commands:
      - tapOn:
          id: ai_data_consent_alert_allow
- extendedWaitUntil:
    notVisible:
      id: ai_tutor_create_community_input_scenario
      text: ${OLD_SCENARIO}
    timeout: 45000
- assertVisible:
    id: ai_tutor_create_community_input_scenario
