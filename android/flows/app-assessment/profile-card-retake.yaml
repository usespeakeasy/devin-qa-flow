# Profile App Assessment card with a previous result that can be retaken: scroll to the retake link
# (`app_assessment_entry_card_check_progress_button`, the progress card above the result) and tap it.
# The assessment opens fresh on its intro (`app_assessment_intro`).
# Entry: Profile tab; card in the previous-result state (EligibleAgain with a previous result; on dev a
# QA-only patch: `debug.qa.aa=retake` in `AppAssessmentEntryPointStore.observe`). Exit: assessment intro. Saves SHOT.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "profile-card-retake"}
---
- scrollUntilVisible:
    element:
      id: app_assessment_entry_card_check_progress_button
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: app_assessment_entry_card_result
- tapOn:
    id: app_assessment_entry_card_check_progress_button
- extendedWaitUntil:
    visible:
      id: app_assessment_intro
    timeout: 30000
- assertNotVisible:
    id: app_assessment_result
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${SHOT}
