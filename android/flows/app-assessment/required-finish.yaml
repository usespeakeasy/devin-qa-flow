# Finish the required assessment: Start, record the (one) answer, Continue, results, Return home: Main shows on
# Home with the bar and the required intro is gone. Entry: required intro on Main, microphone granted, a one-prompt
# attempt (or each prompt repeated by the caller). Exit: Home tab. Saves SHOT.png.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "required-finish"}
---
- tapOn:
    id: app_assessment_intro_start_button
- extendedWaitUntil:
    visible:
      id: com.android.permissioncontroller:id/permission_allow_foreground_only_button
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        id: com.android.permissioncontroller:id/permission_allow_foreground_only_button
    commands:
      - tapOn:
          id: com.android.permissioncontroller:id/permission_allow_foreground_only_button
- extendedWaitUntil:
    visible:
      id: lesson_voice_record_button
    timeout: 30000
- tapOn:
    id: lesson_voice_record_button
- extendedWaitUntil:
    visible:
      id: app_assessment_question_continue_button
    timeout: 60000
- tapOn:
    id: app_assessment_question_continue_button
- extendedWaitUntil:
    visible:
      id: app_assessment_result_return_home_button
    timeout: 60000
- runFlow: result-return-home.yaml
- assertNotVisible:
    id: app_assessment_intro
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: main_tab_home
      selected: true
    timeout: 30000
- assertNotVisible:
    id: app_assessment_intro
- takeScreenshot: ${SHOT}
