# Free Talk Topics page after process death or rotation: topic tab TAB_ID is still the checked tab.
# Entry: relaunch onto Free Talk. Exit: Free Talk tab.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "topic-tab-restored"}
---
- extendedWaitUntil:
    visible:
      id: ai_tutor_history_button
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${SHOT}
- assertVisible:
    id: ${TAB_ID}
    checked: true
