# Free Talk tab: open DEST (history: the History button > history list; favorites: the heart > Favorites;
# create: the Create your own button > the character step of lesson creation). The case script backs out and asserts
# the tab again (speak-android#9385).
# Entry: Free Talk tab. Exit: the DEST screen.
# maestro test -e DEST=history open-toolbar-destination.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEST: ${DEST || "history"}
---
- runFlow:
    when:
      true: ${DEST == "history"}
    commands:
      - tapOn:
          id: ai_tutor_history_button
      - extendedWaitUntil:
          visible:
            id: history_screen
          timeout: 30000
- runFlow:
    when:
      true: ${DEST == "favorites"}
    commands:
      - tapOn:
          id: ai_tutor_favorites_button
      - extendedWaitUntil:
          visible:
            id: ai_tutor_favorites_screen
          timeout: 30000
- runFlow:
    when:
      true: ${DEST == "create"}
    commands:
      - tapOn:
          id: ai_tutor_create_community_button
      - extendedWaitUntil:
          visible:
            id: ai_lesson_create_character_continue
          timeout: 30000
- assertNotVisible:
    id: ai_tutor_tab_bar
