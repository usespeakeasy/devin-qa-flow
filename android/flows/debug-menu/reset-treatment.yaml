# Debug Menu > Feature flag override: put a flag with a picker (experiments) back to SERVER.
# Entry: any state (the flow cold-starts the app first). Params: FLAG, CURRENT (the treatment its chip shows now). Force-stop and relaunch afterwards.
# Selectors: the treatment picker has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- launchApp:
    stopApp: true
- openLink: speak-dev://debug-menu
- tapOn: Feature flag override
- tapOn:
    text: Search
- inputText: ${FLAG}
- hideKeyboard
- tapOn:
    text: ${CURRENT}
    rightOf:
      text: ${FLAG}
    index: 0
- assertVisible: "Custom…"
- tapOn:
    text: SERVER
    above: "Custom…"
    index: 0
- extendedWaitUntil:
    visible:
      text: "SERVER · .*"
      below:
        text: ${FLAG}
    timeout: 5000
