# Debug Menu > Feature flag override: give one flag a custom treatment typed into "Custom…".
# Entry: any state with FLAG at SERVER (the flow cold-starts the app first). Exit: on the override list; force-stop and
# relaunch so the next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# maestro test -e FLAG=auth_session_mode -e TREATMENT=speak set-custom-treatment.yaml
# Selectors: the picker and custom-treatment dialogs have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- launchApp:
    stopApp: true
- openLink: speak-dev://debug-menu
- tapOn: Feature flag override
- tapOn:
    text: Search
- inputText: ${FLAG}
- hideKeyboard
- tapOn:
    text: "SERVER"
    rightOf:
      text: ${FLAG}
    index: 0
- tapOn: "Custom…"
- assertVisible: Enter custom treatment
- tapOn: Treatment
# Typing before the keyboard settles drops the first character ("lert_only").
- waitForAnimationToEnd
- inputText: ${TREATMENT}
- assertVisible: "^${TREATMENT}$"
- tapOn: Submit
- assertVisible:
    text: "LOCAL · ${TREATMENT}"
    rightOf:
      text: ${FLAG}
