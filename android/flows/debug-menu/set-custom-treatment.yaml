# Debug Menu > Feature flag override: set a typed (Custom…) treatment, for a flag whose picker lists no option for it
# (e.g. `meet_the_tutor_enabled` lists control / off only). Listed options: set-treatment.yaml. A typed `on` is stored
# as a custom treatment, which app code reading the flag as on/off (GetUserExperiments) still reads as off.
# Entry: any state (the flow cold-starts the app first). Exit: on the override list; force-stop and relaunch so the
# next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# maestro test -e FLAG=auth_session_mode -e VALUE=speak set-custom-treatment.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible:
      id: debug_menu_feature_flag_override
    timeout: 30000
- tapOn:
    id: debug_menu_feature_flag_override
- tapOn:
    id: debug_feature_flag_search
# The first typed key is sometimes doubled, which filters the list to nothing, so clear and type again.
- retry:
    maxRetries: 2
    commands:
      - eraseText: 80
      - inputText: ${FLAG}
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: debug_feature_flag_value_${FLAG}
            index: 0
          timeout: 5000
- tapOn:
    id: debug_feature_flag_value_${FLAG}
    index: 0
- extendedWaitUntil:
    visible:
      id: debug_treatment_picker_dialog
    timeout: 10000
- tapOn:
    id: debug_treatment_picker_custom
- extendedWaitUntil:
    visible:
      id: debug_custom_treatment_dialog
    timeout: 10000
- tapOn:
    id: debug_custom_treatment_input
- eraseText: 40
- inputText: ${VALUE}
- tapOn:
    id: debug_custom_treatment_submit
- extendedWaitUntil:
    notVisible:
      id: debug_custom_treatment_dialog
    timeout: 10000
- assertVisible:
    id: debug_feature_flag_source_${FLAG}
    text: "LOCAL · ${VALUE}"
    index: 0
