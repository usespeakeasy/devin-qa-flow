# Debug Menu > Feature flag override: set one flag to SERVER, ON or OFF.
# Entry: any state (the flow cold-starts the app first, signed in or signed out). Exit: on the
# override list; force-stop and relaunch so the next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# maestro test -e FLAG=android_nav3_segment_kill_switch -e VALUE=ON set-feature-flag.yaml
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- tapOn:
    id: debug_menu_feature_flag_override
- tapOn:
    id: debug_feature_flag_search
- inputText: ${FLAG}
- hideKeyboard
# The value chip cycles on tap. The source label under the key (`SERVER · off`, `LOCAL · on`) shows the override that took.
- repeat:
    times: 3
    while:
      notVisible:
        id: debug_feature_flag_source_${FLAG}
        text: "${VALUE == 'SERVER' ? 'SERVER · .*' : 'LOCAL · ' + VALUE.toLowerCase()}"
        index: 0
    commands:
      - tapOn:
          id: debug_feature_flag_value_${FLAG}
          index: 0
- assertVisible:
    id: debug_feature_flag_source_${FLAG}
    text: "${VALUE == 'SERVER' ? 'SERVER · .*' : 'LOCAL · ' + VALUE.toLowerCase()}"
    index: 0
