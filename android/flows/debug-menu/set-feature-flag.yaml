# Debug Menu > Feature flag override: set one flag to SERVER, ON or OFF.
# Entry: any state (the flow cold-starts the app first, signed in or signed out). Exit: on the
# override list; force-stop and relaunch so the next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# Selectors: IDs from speak-android#8726; builds without them (older release branches) fall back to text.
# FLAG must be a Split or app flag: hand-added (Add Flag) flags get no value ID.
# maestro test -e FLAG=android_nav3_segment_kill_switch -e VALUE=ON set-feature-flag.yaml
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- launchApp:
    stopApp: true
- openLink: speak-dev://debug-menu
- extendedWaitUntil:
    visible: Feature flag override
    timeout: 15000
- runFlow:
    when:
      visible:
        id: debug_menu_feature_flag_override
    commands:
      - tapOn:
          id: debug_menu_feature_flag_override
      - tapOn:
          id: debug_feature_flag_search
      - inputText: ${FLAG}
      - hideKeyboard
      # The value chip cycles on tap; Recent/Favorites can repeat the chip, every copy drives the same flag.
      # The chip's label is a child node, so match it with childOf.
      - repeat:
          times: 3
          while:
            notVisible:
              text: ${VALUE}
              childOf:
                id: debug_feature_flag_value_${FLAG}
          commands:
            - tapOn:
                id: debug_feature_flag_value_${FLAG}
                index: 0
      - assertVisible:
          text: ${VALUE}
          childOf:
            id: debug_feature_flag_value_${FLAG}
- runFlow:
    when:
      notVisible:
        id: debug_feature_flag_screen
    commands:
      - tapOn: Feature flag override
      - tapOn:
          text: Search
      - inputText: ${FLAG}
      - hideKeyboard
      - repeat:
          times: 3
          while:
            notVisible:
              text: ${VALUE}
              rightOf:
                text: ${FLAG}
          commands:
            - tapOn:
                text: "SERVER|ON|OFF"
                rightOf:
                  text: ${FLAG}
                index: 0
      - assertVisible:
          text: ${VALUE}
          rightOf:
            text: ${FLAG}
