# Debug Menu > Subscription override: pick TIER (Real, Free, Premium, Plus).
# Entry: any state, signed in. Exit: on the Debug Menu with the tier's description line showing.
# maestro test -e TIER=Premium set-subscription-override.yaml
# Selectors: the radio options have no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
# Cold start first: an openLink while the Debug Menu's override list is open stays on that list.
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible: "Subscription override"
    timeout: 30000
- tapOn: "^${TIER}$"
- extendedWaitUntil:
    visible: "This device behaves as a (Premium )?${TIER} (subscriber|user).*|No override.*"
    timeout: 10000
