# Debug Menu > Subscription override: pick TIER (Real, Free, Premium, Plus).
# Entry: any state, signed in. Exit: on the Debug Menu with the tier's description line showing.
# maestro test -e TIER=Premium set-subscription-override.yaml
# Selectors: debug_subscription_override_<real|free|premium|plus> and debug_subscription_override_description.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
# Cold start first: an openLink while the Debug Menu's override list is open stays on that list.
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible:
      id: debug_subscription_override_real
    timeout: 30000
- tapOn:
    id: debug_subscription_override_${TIER.toLowerCase()}
- extendedWaitUntil:
    visible:
      id: debug_subscription_override_description
      text: "This device behaves as a (Premium )?${TIER} (subscriber|user).*|No override.*"
    timeout: 10000
