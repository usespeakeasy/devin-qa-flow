# Debug Menu > Feature flag override: pick one treatment of a multi-treatment flag (e.g. auth_session_mode
# speak / firebase) or SERVER, from the treatment picker dialog. On/off flags use set-feature-flag.yaml.
# Entry: any state (the flow cold-starts the app first). Exit: on the override list; force-stop and
# relaunch so the next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# maestro test -e FLAG=auth_session_mode -e VALUE=firebase set-treatment.yaml
# Non-dev package (e.g. stagingDebug): -e APP_ID=com.selabs.speak -e DEBUG_MENU_LINK=speak://debug-menu
# Selectors: the flag row and the dialog options have no resource-id yet (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- tapOn: Feature flag override
- tapOn:
    text: Search
- inputText: ${FLAG}
- hideKeyboard
# The search field also holds the flag name, hence `below: Search`. The row's button shows SERVER or the overridden treatment (lower case), "Apply" sits in the same column above the flag lists (text match ignores case).
- tapOn:
    text: "^(SERVER|[a-z][a-z0-9_-]*)$"
    rightOf:
      text: ${FLAG}
      below: Search
    below: "(Recent|Experiments)"
    index: 0
- extendedWaitUntil:
    visible: "Custom.*"
    timeout: 10000
- tapOn:
    text: "^${VALUE}$"
    below:
      text: ${FLAG}
- extendedWaitUntil:
    notVisible: "Custom.*"
    timeout: 10000
- assertVisible:
    text: "^${VALUE}$"
    rightOf:
      text: ${FLAG}
      below: Search
