# Debug Menu > Feature flag override: pick one treatment of a multi-treatment flag (e.g. auth_session_mode
# speak / firebase) from the treatment picker dialog. SERVER: reset-treatment.yaml. On/off flags: set-feature-flag.yaml.
# Entry: any state (the flow cold-starts the app first). Exit: on the override list; force-stop and
# relaunch so the next cold start reads it. `qa_android.py fresh` (pm clear) drops overrides.
# maestro test -e FLAG=auth_session_mode -e VALUE=firebase set-treatment.yaml
# Non-dev package (e.g. stagingDebug): -e APP_ID=com.selabs.speak -e DEBUG_MENU_LINK=speak://debug-menu
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  DEBUG_MENU_LINK: ${DEBUG_MENU_LINK || "speak-dev://debug-menu"}
---
- launchApp:
    stopApp: true
- openLink: ${DEBUG_MENU_LINK}
- extendedWaitUntil:
    visible:
      id: debug_menu_feature_flag_override
    timeout: 30000
- tapOn:
    id: debug_menu_feature_flag_override
- tapOn:
    id: debug_feature_flag_search
- inputText: ${FLAG}
- hideKeyboard
# The row's value chip opens the treatment picker.
- tapOn:
    id: debug_feature_flag_value_${FLAG}
    index: 0
- extendedWaitUntil:
    visible:
      id: debug_treatment_picker_dialog
    timeout: 10000
- tapOn:
    id: debug_treatment_picker_option_${VALUE}
- extendedWaitUntil:
    notVisible:
      id: debug_treatment_picker_dialog
    timeout: 10000
# The source label under the key (`LOCAL · <treatment>`) shows the override that took; the chip's own text sits on a child.
- assertVisible:
    id: debug_feature_flag_source_${FLAG}
    text: "LOCAL · ${VALUE}"
    index: 0
