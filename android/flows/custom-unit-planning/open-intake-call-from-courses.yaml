# Course selector > Create a course > tutor intake call opens directly (speak-android#9580: no planning intro).
# Entry: signed in on any screen with Home reachable (cold-starts the app). Exit: the intake call screen with End call.
# Preconditions: dev, English>Spanish account whose Meet the Tutor run is open; Debug Menu overrides ON (stored as "ON"):
# tutor_experience, meet_the_tutor_enabled, ait_phone_speak_decisions_gate, ait_phone_speak_cascade,
# user_memory_phone_speak_call_producer_enabled. Allows the AI data alert if shown.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- launchApp:
    stopApp: true
- runFlow: ../../common/home-popups.yaml
- tapOn:
    id: home_course_selector
- extendedWaitUntil:
    visible:
      id: level_selector_ready
    timeout: 30000
- scrollUntilVisible:
    element:
      id: level_selector_create_custom_course
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: level_selector_create_custom_course
- extendedWaitUntil:
    visible:
      id: "phone_speak_call_end_call|ai_data_consent_alert"
    timeout: 45000
- tapOn:
    id: ai_data_consent_alert_allow
    optional: true
- extendedWaitUntil:
    visible:
      id: phone_speak_call_end_call
    timeout: 45000
