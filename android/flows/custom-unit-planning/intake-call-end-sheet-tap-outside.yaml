# Intake call end-call sheet: a tap on the scrim above the sheet closes it and the call goes on (speak-android#9765).
# Entry: the end-call sheet. Exit: the live call, no sheet.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
# Point tap: the scrim has no ID; 50%,12% is above the sheet and away from the call's top controls.
- tapOn:
    point: 50%,12%
- extendedWaitUntil:
    notVisible:
      id: phone_speak_call_end_call_sheet_end_call
    timeout: 10000
- assertVisible:
    id: phone_speak_call_end_call
- assertVisible:
    id: phone_speak_call_screen
