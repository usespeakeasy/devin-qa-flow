# Opens the Meet the Tutor intake call from the Tutor call card on the Courses screen (builds before speak-android#9580) and waits for the call.
# Entry: Home, signed in. Preconditions: dev; account has no Tutor course yet; flags tutor_experience,
# meet_the_tutor_enabled and user_memory_phone_speak_call_producer_enabled read on (server or debug override).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- launchApp:
    stopApp: true
- runFlow: ../../common/home-popups.yaml
- tapOn:
    id: home_course_selector
- extendedWaitUntil:
    visible:
      id: level_selector_ready
    timeout: 30000
- scrollUntilVisible:
    element:
      id: level_selector_start_tutor_call
    direction: UP
    timeout: 20000
- tapOn:
    id: level_selector_start_tutor_call
- extendedWaitUntil:
    visible:
      id: "phone_speak_call_end_call|ai_data_consent_alert"
    timeout: 45000
- tapOn:
    id: ai_data_consent_alert_allow
    optional: true
- extendedWaitUntil:
    visible:
      id: phone_speak_call_end_call
    timeout: 45000
