# Intake call end-call sheet: rotating to landscape keeps the sheet open (speak-android#9765). Follow with
# intake-call-end-sheet-portrait, which returns to portrait. The sheet is a modal window, so the call screen is not in
# the tree while it is open; the call staying up is checked by no 'Phone Speak Ended' in logcat.
# Entry: the end-call sheet. Exit: the end-call sheet in landscape.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: phone_speak_call_end_call_sheet_end_call
    timeout: 10000
- assertVisible:
    id: phone_speak_call_end_call_sheet_keep_talking
