# Manage Account > Delete Account > confirm > password dialog, closed with system Back: Manage Account
# stays, nothing is deleted (no password typed). Entry and exit: Manage Account (manage_account_screen).
# Selectors: the confirm dialog's message and Delete Account button have no IDs (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "delete-password-back"}
---
- tapOn:
    id: edit_delete_account
- extendedWaitUntil:
    visible: "Confirm account deletion"
    timeout: 10000
- tapOn:
    text: "Delete Account"
    rightOf:
      text: "Cancel"
- extendedWaitUntil:
    visible:
      id: delete_account_password_dialog
    timeout: 10000
- takeScreenshot: ${SHOT}_password
- back
- runFlow:
    when:
      visible:
        id: delete_account_password_dialog
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible:
    id: delete_account_password_dialog
- assertVisible:
    id: edit_delete_account
- takeScreenshot: ${SHOT}
