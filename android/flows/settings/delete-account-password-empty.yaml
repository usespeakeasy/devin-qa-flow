# Password dialog with an empty field: Confirm is disabled and a tap on it does nothing, the dialog stays
# open. Then Cancel keeps Manage Account. Entry and exit: Manage Account (manage_account_screen).
# Selectors: the password dialog's Cancel has no ID (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "delete-password-empty"}
---
- runFlow:
    file: delete-account-password-open.yaml
    env:
      SHOT: ${SHOT}_password
- assertVisible:
    id: delete_account_password_confirm_button
    enabled: false
- tapOn:
    id: delete_account_password_confirm_button
- assertVisible:
    id: delete_account_password_dialog
- assertNotVisible: "(?i)incorrect password|verification failed"
- takeScreenshot: ${SHOT}
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible:
    id: delete_account_password_dialog
