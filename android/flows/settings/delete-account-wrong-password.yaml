# Manage Account > Delete Account > confirm > password dialog > WRONG password > Confirm: the
# "Delete account" dialog says "Incorrect password"; Try Again reopens the password dialog; Cancel
# keeps Manage Account. Never types the account's real password, so nothing is deleted.
# Param ERROR: the expected error message (default "Incorrect password"; dev Firebase answers a wrong
# password with a generic credential error, which shows "Verification failed").
# Entry: Settings (settings_manage_account_option), signed in with email/password. Exit: Manage Account.
# Selectors: the confirm and error dialogs have no IDs for their buttons and messages (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  WRONG: ${WRONG || "qa-wrong-password-1"}
  ERROR: ${ERROR || "Incorrect password"}
  SHOT: ${SHOT || "delete-wrong-password"}
---
- tapOn:
    id: settings_manage_account_option
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 20000
- tapOn:
    id: edit_delete_account
- extendedWaitUntil:
    visible: "Confirm account deletion"
    timeout: 10000
- tapOn:
    text: "Delete Account"
    rightOf:
      text: "Cancel"
- extendedWaitUntil:
    visible:
      id: delete_account_password_dialog
    timeout: 10000
- takeScreenshot: ${SHOT}_password
- tapOn:
    id: delete_account_password_input
- inputText: ${WRONG}
- hideKeyboard
- tapOn:
    id: delete_account_password_confirm_button
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 20000
- assertVisible: "(?i)delete account"
- assertNotVisible:
    id: delete_account_password_dialog
- takeScreenshot: ${SHOT}
- tapOn: "(?i)try again"
- extendedWaitUntil:
    visible:
      id: delete_account_password_dialog
    timeout: 10000
- assertNotVisible: ${ERROR}
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible:
    id: delete_account_password_dialog
- assertVisible:
    id: edit_delete_account
