# Manage Account > Delete Account > "Confirm account deletion" > Delete Account: the "Delete account" password
# dialog opens over Manage Account, with the password field empty. Nothing is typed, nothing is deleted.
# Entry: Manage Account (manage_account_screen), signed in with email/password. Exit: the password dialog is open.
# The dialog window hides Manage Account from the tree; the screenshot shows it underneath.
# Selectors: the confirm dialog's message and Delete Account button have no IDs (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "delete-password-open"}
---
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 30000
- tapOn:
    id: edit_delete_account
- extendedWaitUntil:
    visible: "Confirm account deletion"
    timeout: 10000
- tapOn:
    text: "Delete Account"
    rightOf:
      text: "Cancel"
- extendedWaitUntil:
    visible:
      id: delete_account_password_dialog
    timeout: 10000
- assertVisible:
    id: delete_account_password_input
- takeScreenshot: ${SHOT}
