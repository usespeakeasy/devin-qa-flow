# Manage Account > Delete Account > confirm > WRONG password > Confirm shows ERROR; Try Again > WRONG password
# again > Confirm shows ERROR again; Cancel keeps Manage Account. Never types the account's real password.
# Param ERROR: the expected message (default "Incorrect password"; develop before speak-android#9237 shows
# "Verification failed" on dev Firebase).
# Entry and exit: Manage Account (manage_account_screen), signed in with email/password.
# Selectors: the error dialog message is the check (text); its buttons are simple_dialog_* (Navigation 3).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  WRONG: ${WRONG || "qa-wrong-password-1"}
  WRONG2: ${WRONG2 || "qa-wrong-password-2"}
  ERROR: ${ERROR || "Incorrect password"}
  SHOT: ${SHOT || "delete-wrong-password-twice"}
---
- runFlow:
    file: delete-account-password-open.yaml
    env:
      SHOT: ${SHOT}_password
- tapOn:
    id: delete_account_password_input
- inputText: ${WRONG}
- hideKeyboard
- tapOn:
    id: delete_account_password_confirm_button
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 20000
- takeScreenshot: ${SHOT}_first
- tapOn:
    id: simple_dialog_positive_button
- extendedWaitUntil:
    visible:
      id: delete_account_password_dialog
    timeout: 10000
- assertNotVisible: ${ERROR}
- tapOn:
    id: delete_account_password_input
- inputText: ${WRONG2}
- hideKeyboard
- tapOn:
    id: delete_account_password_confirm_button
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 20000
- assertVisible:
    id: simple_dialog_negative_button
- assertNotVisible:
    id: delete_account_password_dialog
- takeScreenshot: ${SHOT}
- tapOn:
    id: simple_dialog_negative_button
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible: ${ERROR}
- assertVisible:
    id: edit_delete_account
