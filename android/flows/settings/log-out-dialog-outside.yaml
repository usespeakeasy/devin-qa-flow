# Log out confirmation closed with a tap outside it (on the scrim): the dialog closes and Settings stays,
# still signed in. Entry: the Log out dialog over Settings (log-out-dialog-open.yaml). Exit: Settings.
# Saves SHOT.png. Selectors: the scrim has no node, so the tap is a point near the top, above the dialog.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "log-out-dialog-outside"}
---
- assertVisible: "Are you sure you want to sign out\\?"
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible: "Are you sure you want to sign out\\?"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings_log_out_option
    direction: DOWN
- assertNotVisible:
    id: onboarding_storybook_screen
- takeScreenshot: ${SHOT}
