# Manage Account > Change Password (edit_password row, email sign-in only): the change password screen shows its
# current, new and retype fields; system Back returns to Manage Account.
# Entry: Manage Account. Exit: Manage Account. Needs an email and password account.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "change-password"}
---
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: edit_password
    direction: DOWN
    timeout: 10000
- tapOn:
    id: edit_password
- extendedWaitUntil:
    visible:
      id: change_password_screen
    timeout: 15000
- assertVisible:
    id: change_password_current_input
- assertVisible:
    id: change_password_new_input
- assertVisible:
    id: change_password_retype_input
- takeScreenshot: ${SHOT}
- back
- runFlow:
    when:
      visible:
        id: change_password_screen
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible:
    id: change_password_screen
