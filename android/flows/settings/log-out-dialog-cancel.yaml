# Log out confirmation > Cancel: the dialog closes and Settings stays, still signed in. Saves SHOT.png.
# Entry: the Log out dialog over Settings (log-out-dialog-open.yaml). Exit: Settings.
# SimpleDialog buttons are `simple_dialog_*` on Navigation 3 and `button1`/`button2` on a Conductor dialog.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "log-out-dialog-cancel"}
---
- assertVisible: "Are you sure you want to sign out\\?"
- tapOn:
    id: "simple_dialog_negative_button|button2"
- extendedWaitUntil:
    notVisible: "Are you sure you want to sign out\\?"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings_log_out_option
    direction: DOWN
- assertNotVisible:
    id: onboarding_storybook_screen
- takeScreenshot: ${SHOT}
