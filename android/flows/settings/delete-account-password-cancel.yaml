# Manage Account > Delete Account > confirm > password dialog > Cancel: the dialog closes, Manage Account
# stays, nothing is deleted (no password typed). Entry and exit: Manage Account (manage_account_screen).
# Selectors: the password dialog's Cancel has no ID (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "delete-password-cancel"}
---
- runFlow:
    file: delete-account-password-open.yaml
    env:
      SHOT: ${SHOT}_password
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible:
    id: delete_account_password_dialog
- assertVisible:
    id: edit_delete_account
- takeScreenshot: ${SHOT}
