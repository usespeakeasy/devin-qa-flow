# Manage Account > Email editor > NEW_EMAIL + WRONG current password > Save: the snackbar shows ERROR, the editor
# stays; Cancel returns to Manage Account, still signed in with the old EMAIL. Never types the account's real
# password, so nothing changes. Save with the email unchanged does nothing, so the flow types NEW_EMAIL.
# Params: EMAIL and NEW_EMAIL (run time only: the signed-in account's email, any unused address); ERROR (default "Your current password is wrong,
# please try again.", the FirebaseAuthInvalidCredentialsException message of SingleFieldInputViewModel).
# Entry and exit: Manage Account (manage_account_screen), signed in with email/password.
# Selectors: the email and password fields share `input` (index 0 and 1, as in SettingsListAccessibilityContractTest).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  WRONG: ${WRONG || "qa-wrong-password-1"}
  ERROR: ${ERROR || "Your current password is wrong, please try again\\."}
  SHOT: ${SHOT || "edit-email-wrong-password"}
---
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 20000
- tapOn:
    id: edit_email
- extendedWaitUntil:
    visible:
      id: single_field_input_screen
    timeout: 15000
- assertVisible:
    id: input
    index: 0
    text: ${EMAIL}
- tapOn:
    id: input
    index: 0
# The tap puts the cursor mid-text; Dpad Down moves it to the end so eraseText clears the whole field.
- pressKey: Remote Dpad Down
- eraseText: 80
- inputText: ${NEW_EMAIL}
- tapOn:
    id: input
    index: 1
- inputText: ${WRONG}
- hideKeyboard
- tapOn:
    id: settings_list_primary_button
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 20000
- assertVisible:
    id: single_field_input_screen
- takeScreenshot: ${SHOT}
- tapOn:
    id: settings_list_secondary_button
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertVisible: ${EMAIL}
- assertNotVisible:
    id: single_field_input_screen
