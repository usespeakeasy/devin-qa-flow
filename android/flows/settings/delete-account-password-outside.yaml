# Password dialog closed with a tap outside it (on the scrim): Manage Account stays, nothing is deleted.
# Entry and exit: Manage Account (manage_account_screen).
# Selectors: the scrim has no node, so the tap is a point near the top of the screen, above the dialog.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "delete-password-outside"}
---
- runFlow:
    file: delete-account-password-open.yaml
    env:
      SHOT: ${SHOT}_password
- hideKeyboard
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible:
      id: delete_account_password_dialog
    timeout: 10000
- assertVisible:
    id: manage_account_screen
- assertVisible:
    id: edit_delete_account
- takeScreenshot: ${SHOT}
