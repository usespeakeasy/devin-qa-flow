# Manage Account > Delete Account > confirm > WRONG password > Confirm shows ERROR; system Back on that dialog
# closes it and keeps Manage Account, still signed in. Never types the account's real password.
# Param ERROR: the expected message (default "Incorrect password"; develop before speak-android#9237 shows
# "Verification failed" on dev Firebase).
# Entry and exit: Manage Account (manage_account_screen), signed in with email/password.
# Selectors: the error dialog message is the check (text).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  WRONG: ${WRONG || "qa-wrong-password-1"}
  ERROR: ${ERROR || "Incorrect password"}
  SHOT: ${SHOT || "delete-wrong-password-back"}
---
- runFlow:
    file: delete-account-password-open.yaml
    env:
      SHOT: ${SHOT}_password
- tapOn:
    id: delete_account_password_input
- inputText: ${WRONG}
- hideKeyboard
- tapOn:
    id: delete_account_password_confirm_button
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 20000
- takeScreenshot: ${SHOT}_error
- back
- extendedWaitUntil:
    visible:
      id: manage_account_screen
    timeout: 10000
- assertNotVisible: ${ERROR}
- assertNotVisible:
    id: delete_account_password_dialog
- assertVisible:
    id: edit_delete_account
- takeScreenshot: ${SHOT}
