# System Back closes the Settings About sheet (`about_sheet`) to Settings.
# Entry: the About sheet open over Settings (about-open.yaml). Exit: Settings with no About sheet.
# The Settings About row has no automation ID yet, so Settings is checked by its title text.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- assertVisible:
    id: about_sheet
- back
- extendedWaitUntil:
    notVisible:
      id: about_sheet
    timeout: 10000
# Rotation or a recreate can move the Settings scroll position, so scroll to the row instead of asserting in place.
- scrollUntilVisible:
    element:
      text: "^About$"
    direction: DOWN
    timeout: 15000
