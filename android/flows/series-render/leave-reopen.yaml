# SeriesLesson: leave right after an answer lands (model still updating), confirm Quit if asked, then reopen
# the same lesson: resume prompt (Continue) or a fresh lesson, never a stuck screen. Entry: series card.
# Exit: series card (`speak_now_header` or `tap_to_continue`). Selectors: quit and resume dialogs have no app
# resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
  QA_SR: ${QA_SR || "false"}
---
- tapOn:
    id: exit
- extendedWaitUntil:
    visible: "Are you sure you want to quit this lesson\\?"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: "^Quit$"
    commands:
      - tapOn: "^Quit$"
- extendedWaitUntil:
    notVisible:
      id: series_list
    timeout: 30000
- openLink: speak-dev://lesson?id=${LESSON_ID}&qa-smart-review=${QA_SR}
- extendedWaitUntil:
    visible: "Continue where you left off\\?"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Continue where you left off\\?"
    commands:
      - tapOn: "^Continue$"
- extendedWaitUntil:
    visible:
      id: "tap_to_continue|speak_now_header|completed_header"
    timeout: 60000
- assertVisible:
    id: series_list
