# Drill lesson, Next 3 times (mid-lesson), ready for Home + am kill. Entry: Home. Exit: drill lesson on card 4.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: ${LESSON_ID || "EN_FR_L1-rev_cava_SP_DL_IC"}
