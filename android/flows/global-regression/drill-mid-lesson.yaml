- runFlow:
    file: ../tutor-lesson/open-fresh.yaml
    env:
      LESSON_ID: ${LESSON_ID}
- runFlow:
    file: ../tutor-lesson/skip-cards.yaml
    env:
      N: 3
- takeScreenshot: c48-01-before-kill
