# Tutor (drill) lesson open: a `speak-dev://lesson?id=` deep link to the same lesson shows the lesson again
# (no blank screen); a "Continue where you left off?" prompt is answered with Start over.
# Entry: a drill lesson (`drill_lesson_skip`). Exit: the drill lesson (`drill_lesson_skip`).
# Selectors: the prompt is the shared SimpleDialog (`simple_dialog`); Start over is its negative button.
# Known: on develop with android_nav3_segment_kill_switch ON (Conductor fallback) the screen goes blank here.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP_DL_IC"}
---
- assertVisible:
    id: drill_lesson_skip
- openLink: speak-dev://lesson?id=${LESSON_ID}
- repeat:
    times: 15
    while:
      notVisible:
        id: drill_lesson_skip
    commands:
      - runFlow:
          when:
            visible:
              id: simple_dialog_negative_button
          commands:
            - tapOn:
                id: simple_dialog_negative_button
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 10000
- assertVisible:
    id: drill_lesson_root
