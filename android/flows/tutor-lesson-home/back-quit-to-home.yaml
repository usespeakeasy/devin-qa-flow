# Tutor (drill) lesson > system Back > close confirmation > Quit, then the check-in or abandon step, back to Home with the tab bar.
# Entry: a drill lesson (QA-only patch: the close confirmation always shows). Exit: Home with the tab bar.
# Selectors: the close confirmation and the abandon step have no resource-ids (text fallback, speak-android#8710).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  SHOT: ${SHOT || "back-quit"}
---
- runFlow: ../tutor-lesson/back-close-sheet-open.yaml
- tapOn: "^Quit$"
- extendedWaitUntil:
    notVisible:
      id: drill_lesson_root
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: home_root_ready
    times: 4
    commands:
      - tapOn:
          id: custom_units_difficulty_check_in_just_right
          optional: true
      - tapOn:
          text: "^(Skip|Not now|Close|Done|Maybe later)$"
          optional: true
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
- assertVisible:
    id: main_tab_home
