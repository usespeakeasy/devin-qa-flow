# App stopped: speak-dev://lesson?id=LESSON_ID opens the series lesson, a line card listens; Back (close sheet if
# asked > Quit) leaves it for Home. Entry: signed in. Exit: home_root_ready.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- stopApp
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: "tap_to_continue|speak_now_header|series_list"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Continue where you left off\\?"
    commands:
      - tapOn: "^Start over$"
- runFlow: ../series-session/first-line-card.yaml
- takeScreenshot: link-lesson
