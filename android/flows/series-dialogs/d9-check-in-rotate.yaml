# Quit > difficulty check-in (QA-only gate patch, debug.qa.unit_no; always-confirm close debug.qa.close=1)
# then rotation and Home/return keep one check-in. Entry: Home. Exit: check-in visible.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- runFlow: ../difficulty-check-in/quit-series-lesson.yaml
- takeScreenshot: d9-check-in
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: custom_units_difficulty_check_in_just_right
    timeout: 10000
- setOrientation: PORTRAIT
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: custom_units_difficulty_check_in_just_right
    timeout: 15000
- assertNotVisible:
    id: series_list
