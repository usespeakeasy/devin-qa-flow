# More options (flag, more_options) double-tapped: one report sheet, Back leaves none; Content error opens the
# report screen, its close returns to the lesson and the sheet opens again. Entry: line card. Exit: series_list.
# Selectors: the report reason rows have no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- doubleTapOn:
    id: more_options
- extendedWaitUntil:
    visible: "^Content error$"
    timeout: 15000
- takeScreenshot: d6-sheet
- back
- extendedWaitUntil:
    notVisible: "^Content error$"
    timeout: 10000
- assertVisible:
    id: series_list
- tapOn:
    id: more_options
- tapOn: "^Content error$"
# release/4.73.0's report screen has no report_* ids (text fallback; hide the keyboard, then Back closes it).
- extendedWaitUntil:
    visible: "Any additional details to share\\?"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: report_close_button
    commands:
      - tapOn:
          id: report_close_button
- runFlow:
    when:
      visible: "Any additional details to share\\?"
    commands:
      - hideKeyboard
      - back
- extendedWaitUntil:
    visible:
      id: series_list
    timeout: 15000
- assertNotVisible: "Any additional details to share\\?"
- assertNotVisible: "^Content error$"
- tapOn:
    id: more_options
- extendedWaitUntil:
    visible: "^Content error$"
    timeout: 15000
- back
- extendedWaitUntil:
    notVisible: "^Content error$"
    timeout: 10000
