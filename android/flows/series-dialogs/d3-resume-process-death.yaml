# Resume prompt open > Home > process death > relaunch: the lesson comes back with one resume prompt, Continue works and no second prompt follows. Entry: Home. Exit: series_list.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- runFlow: answer-and-quit.yaml
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Continue where you left off\\?"
    timeout: 60000
- takeScreenshot: d3-restored
- runFlow:
    when:
      visible: "Continue where you left off\\?"
    commands:
      - tapOn: "^Continue$"
      - extendedWaitUntil:
          notVisible: "Continue where you left off\\?"
          timeout: 10000
- assertNotVisible: "Continue where you left off\\?"
- assertVisible:
    id: series_list
