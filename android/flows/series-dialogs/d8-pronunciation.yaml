# Word on the line card (point fallback: the line's first word has no resource-id) opens one pronunciation
# sheet even when double-tapped; Back closes it and, with hands-free off, the card stays Paused (d8b covers the countdown); rotation and Home/return keep one
# sheet. Entry: line card of EN_ES_A1-1_quetal_SP, pronunciation_coach_multilingual ON. Exit: speak_now_header.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- doubleTapOn:
    point: "43%,37%"
- extendedWaitUntil:
    visible:
      id: pronunciation_phoneme_coach_root
    timeout: 15000
- takeScreenshot: d8-sheet
- back
- extendedWaitUntil:
    notVisible:
      id: pronunciation_phoneme_coach_root
    timeout: 5000
    optional: true
- takeScreenshot: d8-after-one-back
# A second sheet left by the double tap (count PronunciationPhonemeCoach entries in logcat) is closed here.
- runFlow:
    when:
      visible:
        id: pronunciation_phoneme_coach_root
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: pronunciation_phoneme_coach_root
    timeout: 10000
- extendedWaitUntil:
    visible: "^Paused$"
    timeout: 15000
- tapOn:
    point: "43%,37%"
- extendedWaitUntil:
    visible:
      id: pronunciation_phoneme_coach_root
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: pronunciation_phoneme_coach_root
    timeout: 10000
- setOrientation: PORTRAIT
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: pronunciation_phoneme_coach_root
    timeout: 15000
- back
- extendedWaitUntil:
    notVisible:
      id: pronunciation_phoneme_coach_root
    timeout: 10000
- assertVisible:
    id: series_list
