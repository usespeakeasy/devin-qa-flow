# Overview (overview_tap_target) double-tapped: one Lesson Outline, Back leaves none; selecting the current
# series closes it; selecting a locked series on a free account opens Preview Finished, which survives rotation
# and Home/return, and Return home lands on Home. Entry: line card, free account. Exit: home_root_ready.
# Selectors: outline rows have no resource-ids (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- doubleTapOn:
    id: overview_tap_target
- extendedWaitUntil:
    visible: "Lesson Outline"
    timeout: 15000
- back
- extendedWaitUntil:
    notVisible: "Lesson Outline"
    timeout: 5000
    optional: true
- takeScreenshot: d7-after-one-back
# A second sheet left by the double tap (count SeriesOverviewDialog entries in logcat) is closed here.
- runFlow:
    when:
      visible: "Lesson Outline"
    commands:
      - back
- extendedWaitUntil:
    notVisible: "Lesson Outline"
    timeout: 10000
- tapOn:
    id: overview_tap_target
- extendedWaitUntil:
    visible: "Lesson Outline"
    timeout: 15000
- takeScreenshot: d7-outline
- tapOn: "^___, bien\\.$"
- extendedWaitUntil:
    visible:
      id: preview_finished_screen
    timeout: 20000
- assertNotVisible: "Lesson Outline"
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: preview_finished_screen
    timeout: 10000
- setOrientation: PORTRAIT
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: preview_finished_screen
    timeout: 15000
- takeScreenshot: d7-preview
- tapOn:
    id: preview_finished_return_home_button
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 20000
- assertNotVisible:
    id: preview_finished_screen
