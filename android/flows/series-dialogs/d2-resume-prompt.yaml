# Resume prompt: Back does not cancel it, rotation and Home/return keep exactly one, Continue resumes;
# then quit again and Start over restarts. Entry: Home. Exit: lesson intro (tap_to_continue), no prompt.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  LESSON_ID: ${LESSON_ID || "EN_ES_A1-1_quetal_SP"}
---
- runFlow: answer-and-quit.yaml
- back
- assertVisible: "Continue where you left off\\?"
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Continue where you left off\\?"
    timeout: 10000
- setOrientation: PORTRAIT
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Continue where you left off\\?"
    timeout: 15000
- takeScreenshot: d2-resume
- tapOn: "^Continue$"
- extendedWaitUntil:
    notVisible: "Continue where you left off\\?"
    timeout: 10000
- assertVisible:
    id: series_list
- assertNotVisible: "Start over"
- runFlow: answer-and-quit.yaml
- tapOn: "^Start over$"
- extendedWaitUntil:
    visible:
      id: tap_to_continue
    timeout: 30000
- assertNotVisible: "Continue where you left off\\?"
- assertVisible:
    id: series_list
