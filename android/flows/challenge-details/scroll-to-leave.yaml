# Challenge Details already open: scroll down until Leave Challenge (leave_button) is on screen.
# Entry: Challenge Details of a joined challenge. Exit: Challenge Details, leave_button centered.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
---
- extendedWaitUntil:
    visible:
      id: challenge_details_screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: leave_button
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
