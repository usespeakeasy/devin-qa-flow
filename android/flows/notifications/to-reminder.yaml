# Profile tab > Settings > Notifications row (ROW, its copy in the app language, e.g. "^Notifications$") > Daily Reminders.
# Entry: any screen with the main tab bar (Home or Profile). Exit: the Daily Reminders screen.
# Selectors: the Settings Notifications row has no resource-id (text fallback, ROW).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- extendedWaitUntil:
    visible:
      id: main_tab_profile
    timeout: 30000
- tapOn:
    id: main_tab_profile
- tapOn:
    id: action_settings
- extendedWaitUntil:
    visible:
      id: settings_manage_account_option
    timeout: 15000
- scrollUntilVisible:
    element: ${ROW}
    direction: DOWN
    timeout: 15000
- tapOn: ${ROW}
- extendedWaitUntil:
    visible:
      id: notifications_daily_reminder
    timeout: 15000
- runFlow: open-reminder.yaml
