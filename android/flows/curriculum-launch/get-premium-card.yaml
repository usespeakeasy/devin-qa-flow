# Free account: Home learning path "Get Full Access" card > Get Premium (course_premium_upgrade_button) opens the premium intro; close it back to Home.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "c8"}
---
- runFlow: ../../common/launch-home.yaml
- scrollUntilVisible:
    element:
      id: course_premium_upgrade_button
    direction: UP
    timeout: 20000
- tapOn:
    id: course_premium_upgrade_button
- extendedWaitUntil:
    visible:
      id: "onboarding_premium_intro_(ready|error)"
    timeout: 30000
- takeScreenshot: ${SHOT}
- runFlow: ../../common/dismiss-premium-intro.yaml
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
