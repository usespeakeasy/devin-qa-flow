# Challenge Details > fast double tap on Leave Challenge: one sheet opens. One Back closes it and leaves the
# details on screen (a second sheet would still show). Entry: Challenge Details with leave_button on screen.
# Exit: Challenge Details. Saves SHOT.png with the sheet open.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "leave-double-tap"}
---
- doubleTapOn:
    id: leave_button
- extendedWaitUntil:
    visible:
      id: challenge_leave_confirm_sheet
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
- back
- extendedWaitUntil:
    notVisible:
      id: challenge_leave_confirm_sheet
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: challenge_leave_confirm_sheet
- assertVisible:
    id: challenge_details_screen
- assertVisible:
    id: leave_button
