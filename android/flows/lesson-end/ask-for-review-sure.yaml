# Play Store ask: "Sure!" opens the Play listing (web page in Chrome on images without Play Store); back returns to the lesson end flow, which moves on.
# Entry: Play Store ask open (run after ../../common/open-ask-for-review.yaml, then ask-for-review-yes.yaml).
# Selectors: the review dialogs have no resource-id on the Navigation 3 entries (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn: "Sure!"
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "Accept & continue"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: ".*Google Play.*"
    timeout: 30000
- back
- extendedWaitUntil:
    visible:
      id: lesson_end_reskin_root
    timeout: 30000
- assertNotVisible: "Are you enjoying learning languages with Speak\\?"
