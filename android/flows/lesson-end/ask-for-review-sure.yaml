# Play Store ask: "Sure!" opens the Play listing (web page in Chrome on images without Play Store); back returns to the lesson end flow, which moves on.
# Entry: Play Store ask open (run after ../../common/open-ask-for-review.yaml, then ask-for-review-yes.yaml).
# Selectors: ask_for_review_positive_dialog_yes (speak-android#8660); the browser and Play pages are
# third-party text.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ask_for_review_positive_dialog_yes
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "Accept & continue"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: ".*Google Play.*"
    timeout: 30000
- back
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_positive_dialog
