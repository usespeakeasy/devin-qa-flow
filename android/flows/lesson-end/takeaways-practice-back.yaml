# Lesson end takeaways step: system back on "Time to practice" closes the whole lesson end flow and
# returns Home.
# Entry: the takeaways step is showing (run `android/common/open-takeaways.yaml` first) on a build
# with the QA-only takeaways patch, `debug.qa.takeaways` unset.
# Selectors: `lesson_end_takeaways_generated_lesson_root`.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/takeaways-to-practice.yaml
- extendedWaitUntil:
    visible:
      id: lesson_end_takeaways_generated_lesson_root
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
- assertNotVisible:
    id: lesson_end_takeaways_generated_lesson_root
- assertNotVisible:
    id: "lesson_end_.*_root"
