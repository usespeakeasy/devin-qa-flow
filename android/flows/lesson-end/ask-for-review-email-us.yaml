# Feedback ask: "Email us" opens the survey in the browser; back returns to the lesson end flow, which moves on.
# Entry: feedback ask open (run after ../../common/open-ask-for-review.yaml, then ask-for-review-no.yaml).
# Selectors: ask_for_review_negative_dialog_yes (speak-android#8660); the browser and survey pages are
# third-party text.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ask_for_review_negative_dialog_yes
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "Accept & continue"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: ".*[Ss]urvey.*"
    timeout: 30000
- back
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_negative_dialog
