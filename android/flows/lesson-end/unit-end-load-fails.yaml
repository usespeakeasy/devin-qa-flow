# Lesson end "unit finished" step whose unit info fails to load: the step moves the flow on by itself
# and the celebration never shows.
# Entry: Home, signed in, Debug Menu > Subscription override > Premium. Preconditions: the QA-only
# END_OF_UNIT_CELEBRATION patch with a unit number past the end of the course
# (`adb shell setprop debug.qa.unit_no 999`).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
# Optional referral welcome prompt; it has no resource-id on develop yet (text fallback).
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- runFlow: ../../common/tap-debug-finish.yaml
- repeat:
    while:
      notVisible:
        id: "lesson_end_.*_root|home_root_ready|learning_path_ready"
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root|home_root_ready|learning_path_ready"
    timeout: 30000
- assertNotVisible:
    id: unit_end_screen
