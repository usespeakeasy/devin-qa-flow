# Lesson end freemium "Coming up tomorrow" step: Try unlimited lessons opens the upgrade paywall in place of the step.
# Entry: the step is showing (run `android/common/open-freemium-coming-up.yaml` first; it needs the QA-only
# FREEMIUM_NEXT_UNLOCKED patch and Debug Menu > Subscription override > Free).
# Exit: on the paywall. Close it with the paywall close flows.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: "freemium_education_coming_up"
- tapOn:
    id: "freemium_education_coming_up_try_unlimited_lessons"
- extendedWaitUntil:
    notVisible:
      id: "freemium_education_coming_up"
    timeout: 30000
