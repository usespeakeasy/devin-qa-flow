# Lesson end streak freeze step: system back closes the whole lesson end flow and returns Home.
# Entry: the streak freeze step is showing (run `android/common/open-streak-freeze.yaml` first;
# it needs the QA-only STREAK_FREEZE patch and a premium account, Debug Menu > Subscription override > Premium).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: lesson_end_streak_freeze_root
- back
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
- assertNotVisible:
    id: lesson_end_streak_freeze_root
- assertNotVisible:
    id: lesson_end_reskin_root
