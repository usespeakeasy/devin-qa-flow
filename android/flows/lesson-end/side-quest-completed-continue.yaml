# Lesson end side quest completed step: tap anywhere shows the second message and Continue,
# Continue moves the flow on to its next step (not Home).
# Entry: the side quest completed step is showing (run `android/common/open-side-quest-completed.yaml` first;
# it needs the QA-only SIDE_QUEST_COMPLETED patch and a premium account, Debug Menu > Subscription override > Premium).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: lesson_end_side_quest_completed_root
- assertVisible:
    text: ".*completed all vocab lessons for this unit.*"
- assertNotVisible:
    id: lesson_end_side_quest_completed_continue_button
# The whole screen is the click target.
- tapOn:
    id: lesson_end_side_quest_completed_root
- extendedWaitUntil:
    visible:
      text: ".*restart you from the beginning.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: lesson_end_side_quest_completed_continue_button
    timeout: 10000
- tapOn:
    id: lesson_end_side_quest_completed_continue_button
- extendedWaitUntil:
    notVisible:
      id: lesson_end_side_quest_completed_root
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*"
    timeout: 30000
- assertNotVisible:
    id: home_root_ready
