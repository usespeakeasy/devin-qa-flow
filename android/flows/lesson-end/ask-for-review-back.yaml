# First review dialog: system back closes it, no follow-up, and the lesson end flow moves on.
# Entry: first review dialog open (run after ../../common/open-ask-for-review.yaml).
# Selectors: the review dialogs have no resource-id on the Navigation 3 entries (text fallback).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- back
- extendedWaitUntil:
    visible:
      id: lesson_end_reskin_root
    timeout: 30000
- assertNotVisible: "Are you enjoying learning languages with Speak\\?"
- assertNotVisible: "Glad to hear it\\..*"
