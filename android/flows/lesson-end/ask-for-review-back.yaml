# First review dialog: system back closes it, no follow-up, and the lesson end flow moves on.
# Entry: first review dialog open (run after ../../common/open-ask-for-review.yaml).
# Selectors: the dialogs' ask_for_review_* resource-ids (speak-android#8660).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- back
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_dialog
- assertNotVisible:
    id: ask_for_review_positive_dialog
