# Lesson end takeaways step: Next, Continue, then on "Time to practice" Save for later moves the
# flow on to its next step.
# Entry: the takeaways step is showing (run `android/common/open-takeaways.yaml` first) on a build
# with the QA-only takeaways patch, `debug.qa.takeaways` unset.
# Selectors: `lesson_end_takeaways_generated_lesson_root`, `lesson_end_takeaways_generated_lesson_save_for_later_button`.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- runFlow: ../../common/takeaways-to-practice.yaml
- extendedWaitUntil:
    visible:
      id: lesson_end_takeaways_generated_lesson_root
    timeout: 15000
- tapOn:
    id: lesson_end_takeaways_generated_lesson_save_for_later_button
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root|ask_for_review_dialog|home_root_ready"
    timeout: 30000
- assertNotVisible:
    id: lesson_end_takeaways_generated_lesson_root
- assertNotVisible:
    id: lesson_end_takeaways_root
