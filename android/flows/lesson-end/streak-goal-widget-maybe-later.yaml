# Lesson end streak goal step: pick 7 days (the label under the goals changes), I'm committed opens the
# widget prompt, Maybe later moves the flow on to its next step; neither the goal nor the prompt stays.
# Entry: the streak goal step is showing (run `android/common/open-streak-goal.yaml` first, with
# `debug.qa.widget` empty so the prompt shows). Exit: the step after the streak goal.
# Selectors: the widget prompt has no resource-id (text fallbacks).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible: "Streak goals help you stay committed.*"
- tapOn:
    id: goal_7days
- extendedWaitUntil:
    visible: "You.ll be \\d+x more likely to complete the course!"
    timeout: 10000
- tapOn:
    id: primary_button
- extendedWaitUntil:
    visible: "See your progress from your home screen"
    timeout: 15000
- assertVisible: "Add widget"
- tapOn: "Maybe later"
- extendedWaitUntil:
    notVisible: "See your progress from your home screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: lesson_end_reskin_root
    timeout: 30000
- assertNotVisible:
    id: goal_7days
- assertNotVisible:
    id: home_root_ready
