# Lesson end summary step: system back closes the whole lesson end flow and returns Home.
# Entry: the summary step is showing (`android/common/open-summary.yaml`).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: lesson_end_reskin_root
- back
- extendedWaitUntil:
    visible:
      id: home_root_ready
    timeout: 30000
- assertNotVisible:
    id: lesson_end_reskin_root
- assertNotVisible:
    id: "lesson_end_.*_root"
