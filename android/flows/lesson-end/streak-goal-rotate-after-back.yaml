# Lesson end streak goal step: after back from the widget prompt and a rotation on the goal, I'm committed
# still works and a fast double tap opens the prompt once (back lands on the goal, no second prompt).
# Entry: the streak goal step is showing (`android/common/open-streak-goal.yaml`, `debug.qa.widget` empty).
# Exit: portrait, the goal with 7 days picked.
# Selectors: the widget prompt has no resource-id (text fallbacks).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: goal_7days
- extendedWaitUntil:
    visible: "You.ll be \\d+x more likely to complete the course!"
    timeout: 10000
- tapOn:
    id: primary_button
- extendedWaitUntil:
    visible: "See your progress from your home screen"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: goal_7days
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: goal_3days
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "You.ll be \\d+x more likely to complete the course!"
- doubleTapOn:
    id: primary_button
- extendedWaitUntil:
    visible: "See your progress from your home screen"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: goal_7days
    timeout: 15000
- assertNotVisible: "See your progress from your home screen"
