# Lesson end summary step that allows skipping to the next lesson: Keep Learning opens the next lesson.
# Entry: the summary step is showing with Keep Learning and Maybe Later (`android/common/open-summary.yaml`,
# `debug.qa.summary skip`; the flow's `nextActivity` comes from the dev server, or the QA-only patch replays the same lesson when dev sends none).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- assertVisible:
    id: lesson_end_reskin_keep_going_button
- assertVisible: "Keep Learning"
- assertVisible:
    id: lesson_end_reskin_go_home_button
- assertVisible: "Maybe Later"
- assertNotVisible:
    id: lesson_end_reskin_continue_button
- tapOn:
    id: lesson_end_reskin_keep_going_button
- extendedWaitUntil:
    visible:
      id: "drill_lesson_skip|tap_to_continue"
    timeout: 60000
- assertNotVisible:
    id: lesson_end_reskin_root
- assertNotVisible:
    id: home_root_ready
