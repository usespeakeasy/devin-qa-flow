# First review dialog: a tap on the scrim closes it, no follow-up, and the lesson end flow moves on.
# Entry: first review dialog open (run after ../../common/open-ask-for-review.yaml).
# Selectors: ask_for_review_* resource-ids (speak-android#8660); the scrim tap is a point (no element).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
# Point tap: the scrim above the centred card has no element to target.
- tapOn:
    point: "50%,12%"
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_dialog
- assertNotVisible:
    id: ask_for_review_positive_dialog
