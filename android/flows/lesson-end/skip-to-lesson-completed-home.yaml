# Open a drill lesson, skip every card, and press Home as soon as the lesson leaves the drill screen,
# so the app goes to the background on the lesson completed screen (confetti) or the progress wait.
# Entry: Home, signed in. Exit: the launcher, the app in the background.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    id: referral_welcome_dialog_later_button
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      visible:
        id: drill_lesson_skip
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- pressKey: Home
