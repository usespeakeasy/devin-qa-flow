# New Concepts step: concept row > details sheet, close it with a swipe down: the sheet closes and the list keeps the row.
# Entry: New Concepts step with CONCEPT. Exit: New Concepts step, list unchanged.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  CONCEPT: "^hasta luego$"
---
- tapOn: ${CONCEPT}
- extendedWaitUntil:
    visible:
      id: smart_review_concept_details_sheet
    timeout: 15000
# Point swipe: the sheet's drag handle sits near its top edge, a swipe from its center travels too little.
- swipe:
    start: 50%, 72%
    end: 50%, 99%
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: smart_review_concept_details_sheet
    timeout: 15000
- assertVisible:
    id: smart_review_concept_summary_root
- assertVisible: ${CONCEPT}
