# New Concepts step: a quick double tap on Continue moves to the next lesson end step (the lesson end summary).
# Entry: New Concepts step. Exit: next lesson end step. Check the step completes once in logcat.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- doubleTapOn:
    id: smart_review_concept_summary_continue_button
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 15000
- assertNotVisible:
    id: smart_review_concept_summary_root
