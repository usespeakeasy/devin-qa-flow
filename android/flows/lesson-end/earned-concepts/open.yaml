# Finish a drill lesson and arrive on the lesson end "New Concepts" step (EarnedConcepts).
# Entry: Home, signed in. Precondition: the lesson end has the EARNED_CONCEPTS step (live data or a QA-only patch that puts it first). Exit: the New Concepts step.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
  CONCEPT: "^muy bien$"
  LESSON_ID: EN_ES_A1-1_quetal_SP_DL_IC
---
- tapOn:
    text: "Later"
    optional: true
- openLink: speak-dev://lesson?id=${LESSON_ID}
- extendedWaitUntil:
    visible:
      id: drill_lesson_skip
    timeout: 60000
- repeat:
    while:
      visible:
        id: drill_lesson_skip
    times: 60
    commands:
      - tapOn:
          id: drill_lesson_skip
          optional: true
- extendedWaitUntil:
    visible:
      id: smart_review_concept_summary_root
    timeout: 60000
- assertVisible: "Review them later in the Practice Tab!"
- assertVisible: "^NEW$"
- assertVisible: ${CONCEPT}
- assertVisible:
    id: smart_review_concept_summary_continue_button
