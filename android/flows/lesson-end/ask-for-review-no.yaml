# First review dialog: "No" swaps it for the feedback email ask.
# Entry: first review dialog open (run after ../../common/open-ask-for-review.yaml).
# Selectors: the dialogs' ask_for_review_* resource-ids (speak-android#8660).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ask_for_review_dialog_no
- extendedWaitUntil:
    visible:
      id: ask_for_review_negative_dialog
    timeout: 15000
- assertNotVisible:
    id: ask_for_review_dialog
