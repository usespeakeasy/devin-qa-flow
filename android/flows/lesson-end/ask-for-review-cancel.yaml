# Feedback ask: "Cancel" closes it and the lesson end flow moves on.
# Entry: feedback ask open (run after ../../common/open-ask-for-review.yaml, then ask-for-review-no.yaml).
# Selectors: the dialogs' ask_for_review_* resource-ids (speak-android#8660).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ask_for_review_negative_dialog_no
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_negative_dialog
