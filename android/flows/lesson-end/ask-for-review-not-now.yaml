# Play Store ask: "Not now" closes it and the lesson end flow moves on.
# Entry: Play Store ask open (run after ../../common/open-ask-for-review.yaml, then ask-for-review-yes.yaml).
# Selectors: the dialogs' ask_for_review_* resource-ids (speak-android#8660).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak.dev
---
- tapOn:
    id: ask_for_review_positive_dialog_no
- extendedWaitUntil:
    visible:
      id: "lesson_end_.*_root"
    timeout: 30000
- assertNotVisible:
    id: ask_for_review_positive_dialog
