# Free Talk scenario pre-lesson > Start lesson > AI lesson; a China launch shows "Content generated by AI" at the
# bottom of the lesson (speak-android#8960). EXPECT=absent checks a global launch shows no label.
# Entry: `ai_lesson_pre_lesson_screen` (tap a scenario card on Free Talk Topics; the Topics "Start lesson" upsell card
# opens the paywall on a free account). Works on a free account. Exit: AI lesson.
# Selectors: the label has no resource-id (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  EXPECT: ${EXPECT || "present"}
---
- tapOn:
    id: ai_lesson_pre_lesson_start
- extendedWaitUntil:
    visible:
      id: ai_lesson_partner_message
    timeout: 60000
- runFlow:
    when:
      true: ${EXPECT == "present"}
    commands:
      - assertVisible: "Content generated by AI"
- runFlow:
    when:
      true: ${EXPECT == "absent"}
    commands:
      - assertNotVisible: "Content generated by AI"
