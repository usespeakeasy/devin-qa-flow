# Tutor chat: hold the message matching MESSAGE (regex), Copy in the feedback sheet, paste into the message field,
# and check the pasted text fully matches EXPECT (speak-android#8960: a China launch appends "Content generated by AI"
# to a copied tutor reply, never to the learner's own message). The field is cleared again before exit.
# Entry/exit: tutor chat (`input_message` on screen).
# Selectors: messages share the id `message`, so MESSAGE picks one by text; the system "Paste" chip has no id (text).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  MESSAGE: ${MESSAGE || ".*"}
  EXPECT: ${EXPECT || ".*"}
---
- longPressOn:
    id: message
    text: ${MESSAGE}
- extendedWaitUntil:
    visible:
      id: tutor_feedback_sheet
    timeout: 10000
- tapOn:
    id: action_copy
- extendedWaitUntil:
    notVisible:
      id: tutor_feedback_sheet
    timeout: 10000
- longPressOn:
    id: input_message
- tapOn: "Paste"
- assertVisible:
    id: input_message
    text: ${EXPECT}
- eraseText: 2000
