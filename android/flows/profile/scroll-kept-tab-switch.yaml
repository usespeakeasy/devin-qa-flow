# Profile scroll position survives a tab switch: Profile, scroll down to "See all activities", Home tab, Profile tab again:
# Profile is still scrolled (the activity log button shows, the stats header does not).
# Entry: main tabs, signed in, an account with activity log rows. Exit: Profile tab, scrolled.
# maestro test -e SHOT=scroll scroll-kept-tab-switch.yaml
# Selectors: "See all activities" is a generic `button` id shared by other rows (text fallback).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.selabs.speak.dev"}
  SHOT: ${SHOT || "profile-scroll"}
---
- tapOn:
    id: main_tab_profile
- extendedWaitUntil:
    visible:
      id: action_settings
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^See all activities$"
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: stat_sentences_title|stat_streak_title
- takeScreenshot: ${SHOT}-scrolled
- tapOn:
    id: main_tab_home
- extendedWaitUntil:
    visible:
      id: learning_path_ready
    timeout: 30000
- tapOn:
    id: main_tab_profile
- extendedWaitUntil:
    visible:
      text: "^See all activities$"
    timeout: 10000
- assertNotVisible:
    id: stat_sentences_title|stat_streak_title
- takeScreenshot: ${SHOT}-kept
