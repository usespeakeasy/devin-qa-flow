appId: com.selabs.speak-v2.dev
---
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Welcome to your Speak Premium.*"
          commands:
            - tapOn: "OK"
      - runFlow:
          when:
            visible: "Invite friends and get.*"
          commands:
            - tapOn: "Later"
      - runFlow:
          when:
            visible: "Save your .*streak!"
          commands:
            - swipe:
                direction: DOWN
      - runFlow:
          when:
            visible:
              id: custom-courses.announcement.action.primary
          commands:
            # "Made for you" custom course popover: tap its dismiss region above the card.
            - tapOn:
                point: "50%,15%"
      - runFlow:
          when:
            visible:
              id: onboarding.premium-intro.action.close
          commands:
            - tapOn:
                id: onboarding.premium-intro.action.close
      - waitForAnimationToEnd
