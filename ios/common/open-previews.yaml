# Home -> Settings -> Previews (debug preview catalog). Dev builds only.
# Entry: Home. Exit: the catalog list (debug.previews.list). The Settings "Previews" row has no
# identifier (SettingsAccessibilityIdentifier leaves it nil).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element: "Previews"
    direction: DOWN
- tapOn: "Previews"
- extendedWaitUntil:
    visible:
      id: "debug.previews.list"
    timeout: 10000
