# Home -> Settings -> Notifications -> Daily Reminders (CompactDailyRemindersVC).
# Entry: Home. The row and the switches have no identifier.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: open-notification-settings.yaml
- tapOn: "Daily Reminders"
- extendedWaitUntil:
    visible:
      id: "Daily Reminders"
    timeout: 10000
- extendedWaitUntil:
    visible: "Allow Daily Reminders"
    timeout: 10000
