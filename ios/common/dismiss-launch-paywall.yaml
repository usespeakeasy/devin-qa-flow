appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
# Superwall paywall shown on launch with the Free plan override; its close X is web content outside the tree.
- runFlow:
    when:
      visible: "Check out plans"
    commands:
      - tapOn:
          point: "26,73"
      - extendedWaitUntil:
          notVisible: "Check out plans"
          timeout: 10000
# Superwall launch paywall on a Free pool account ("Join over 5 million users", Subscribe /
# View more plans); its close X (top right) is web content outside the tree.
- runFlow:
    when:
      visible: "View more plans"
    commands:
      - tapOn:
          point: "91%,8%"
      - extendedWaitUntil:
          notVisible: "View more plans"
          timeout: 10000
