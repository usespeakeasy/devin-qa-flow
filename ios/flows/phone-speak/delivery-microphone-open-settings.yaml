# Schedule, Call me selected, microphone denied: tap "Turn on microphone" under Call me and wait for iOS
# Settings ("Return to Speak Dev" breadcrumb). Entry: as delivery-microphone-notice.yaml.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: delivery-microphone-notice.yaml
- tapOn: "Turn on microphone"
- extendedWaitUntil:
    visible:
      id: breadcrumb
    timeout: 15000
