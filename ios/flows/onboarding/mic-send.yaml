# B2: send the recording online; the chat moves to the next step (user turn ready again).
# Entry: recording (arrow.up) with audio already played.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
# With debugAudioAutoStopFileRecorder the recording stops and sends itself when the injected audio ends.
- runFlow:
    when:
      visible:
        id: arrow.up
    commands:
      - tapOn:
          id: arrow.up
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "onboarding.user-turn.ready|onboarding.questionnaire.option.*|onboarding.text-input|onboarding.action.continue|onboarding.action.generate-curriculum"
    timeout: 90000
