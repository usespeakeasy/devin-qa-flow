# Flips the "Hands-free speaking" setting from the lesson Settings sheet. The caller reads the current mode from the app
# log ("turnModeChanged(...auto|manual)" / "Not starting auto mode") because the toggle's state isn't in the tree.
# Entry: native AI lesson open. Exit: lesson, settings closed.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- tapOn:
    id: "gearshape.fill"
- extendedWaitUntil:
    visible: "Hands-free speaking"
    timeout: 10000
# The row's switch has no identifier, and a tap on the "Hands-free speaking" label doesn't flip it, so this taps the
# switch by its value ("0"/"1") between the rows above and below it. A fixed point fails: the sheet drops the "Auto
# start recording" row in hands-free mode, which moves the rows (speak-ios#10426 QA, 2026-11-16).
- tapOn:
    text: "[01]"
    below: "Always show translations"
    above: "Slow audio"
- tapOn: "close-icon"
