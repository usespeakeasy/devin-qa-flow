# Opens the AI lesson quit confirmation from the header close button (xmark) and screenshots it at arrival.
# Entry: native AI lesson open. Exit: quit sheet open. Param: SHOT (screenshot name).
# The sheet is a separate window that Maestro's hierarchy does not show: assert arrival ("Quit the lesson?")
# and tap Keep Learning from the caller with `axe describe-ui --point` / `axe tap`.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- tapOn:
    id: "xmark"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT || 'quit-sheet'}
