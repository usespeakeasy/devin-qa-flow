# Jump-in Lesson Finished: Go home (lesson.end.action.go-home, "Maybe Later") continues the EOL
# flow (variantFinishedScreenDidComplete) and ends back on the Practice tab.
# Entry: jump-in Lesson Finished screen (jump-in-vocab-finish.yaml). Dev build.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- tapOn:
    id: "lesson.end.action.go-home"
- runFlow:
    file: ../../common/finish-eol-flow.yaml
    env:
      DONE: "Quick lessons"
- assertVisible: "Vocab"
- takeScreenshot: jump-in-go-home-practice
