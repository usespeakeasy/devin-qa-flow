# F: background on another tab; app stays on that tab, then Home scrolls and shows the popover.
# Entry: Home.
# Precondition: signed in, in-progress Learning Path (current lesson not finished). Dev or prod.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- extendedWaitUntil:
    visible:
      id: home.root.ready
    timeout: 20000
- runFlow: ../../common/learning-path-scroll-away.yaml
- tapOn:
    id: tab-bar.tab.practice
- extendedWaitUntil:
    notVisible:
      id: home.root.ready
    timeout: 10000
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: tab-bar.tab.practice
    timeout: 10000
- assertNotVisible:
    id: home.root.ready
- takeScreenshot: f-still-on-practice
- tapOn:
    id: tab-bar.tab.learningPathCourseOnly
- runFlow: ../../common/learning-path-assert-current-popover.yaml
- takeScreenshot: f-arrival
