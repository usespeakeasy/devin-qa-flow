# D: finish the current lesson LESSON (required -e LESSON=<lesson id>, the popover activity) (debug Finish in its popover), leave and return to Home; path shows the next lesson popover.
# Entry: Home.
# Precondition: signed in, in-progress Learning Path (current lesson not finished). Dev only (debug Finish button).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- extendedWaitUntil:
    visible:
      id: home.root.ready
    timeout: 20000
- runFlow: ../../common/learning-path-assert-current-popover.yaml
- takeScreenshot: d-before-finish
- tapOn:
    id: "debug.learningPath.finish.${LESSON}"
- waitForAnimationToEnd
- tapOn:
    id: tab-bar.tab.practice
- extendedWaitUntil:
    notVisible:
      id: home.root.ready
    timeout: 10000
- tapOn:
    id: tab-bar.tab.learningPathCourseOnly
- runFlow: ../../common/learning-path-assert-current-popover.yaml
- takeScreenshot: d-arrival
