# B: scroll away, background, reopen; path scrolls back and shows the popover.
# Entry: Home.
# Precondition: signed in, in-progress Learning Path (current lesson not finished). Dev or prod.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- extendedWaitUntil:
    visible:
      id: home.root.ready
    timeout: 20000
- runFlow: ../../common/learning-path-scroll-away.yaml
- takeScreenshot: b-scrolled-away
- pressKey: home
- extendedWaitUntil:
    notVisible:
      id: home.root.ready
    timeout: 10000
- launchApp:
    stopApp: false
- runFlow: ../../common/learning-path-assert-current-popover.yaml
- takeScreenshot: b-arrival
