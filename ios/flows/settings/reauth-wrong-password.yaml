# A3: Settings > Account > change email asks for the current password; a wrong one shows the
# wrong-password alert, OK keeps the form, Cancel returns to Account, Back to Settings.
# Entry: Home, signed in with an email account. Pass -e NEW_EMAIL (not saved: the password is wrong).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
  SHOTS: "${typeof SHOTS === 'undefined' ? '' : SHOTS}"
---
- runFlow: ../../common/open-settings.yaml
- tapOn:
    id: settings.row.account
- extendedWaitUntil:
    visible:
      id: settings.account.ready
    timeout: 10000
- tapOn:
    id: "settings.account.field.email.*"
- extendedWaitUntil:
    visible:
      id: settings.account.change-data.ready
    timeout: 10000
- tapOn:
    id: settings.account.change-data.field.value
- eraseText: 60
- inputText: ${NEW_EMAIL}
- tapOn:
    id: settings.account.change-data.field.current-password
- inputText: "wrong-pass-1"
- tapOn:
    id: settings.account.change-data.action.save
- extendedWaitUntil:
    visible: "Your current password is wrong, please try again\\."
    timeout: 20000
- takeScreenshot: ${SHOTS}a3-reauth-alert
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: settings.account.change-data.ready
    timeout: 10000
- tapOn:
    id: settings.account.change-data.action.cancel
# Discard-changes confirmation is a UIAlert without identifiers.
- runFlow:
    when:
      visible: "Are you sure you want to cancel\\?.*"
    commands:
      - tapOn: "Yes"
- extendedWaitUntil:
    visible:
      id: settings.account.ready
    timeout: 10000
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: settings.row.account
    timeout: 10000
