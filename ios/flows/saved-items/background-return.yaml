appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
# Lifecycle: background on Saved lines and come back.
---
- runFlow: ../saved-lines/open-saved-lines.yaml
- pressKey: home
- waitForAnimationToEnd:
    timeout: 3000
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Recent"
    timeout: 15000
- assertVisible: ${FIRST}
- takeScreenshot: ${SHOT}_1_foreground
