appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
# A2: open WORD's dictionary sheet, Unsave then Save in the sheet, close it; WORD is still above NEXT.
---
- runFlow: ../saved-lines/open-saved-lines.yaml
- tapOn: ${WORD}
- extendedWaitUntil:
    visible: "Report feedback"
    timeout: 15000
- assertVisible: "Unsave"
- takeScreenshot: ${SHOT}_1_sheet
- tapOn: "Unsave"
- extendedWaitUntil:
    visible: "Save"
    timeout: 10000
- takeScreenshot: ${SHOT}_2_unsaved
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Unsave"
    timeout: 10000
- swipe:
    start: 50%, 12%
    end: 50%, 95%
    duration: 400
- extendedWaitUntil:
    notVisible: "Report feedback"
    timeout: 10000
- assertVisible:
    text: ${WORD}
    above: ${NEXT}
- takeScreenshot: ${SHOT}_3_closed
