# A1 (speak-ios#10028): email sign-in, type email and password, tap the eye button.
# Entry: signed out, welcome screen. Pass -e EMAIL -e PASSWORD. The case script checks the
# revealed value and the keyboard from the tree. Builds without an eye button skip the tap.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: ../../common/open-email-sign-in.yaml
- tapOn:
    id: auth.email.field
- inputText: ${EMAIL}
- tapOn:
    id: auth.password.field
- inputText: ${PASSWORD}
- runFlow:
    when:
      visible: "Show password"
    commands:
      - tapOn: "Show password"
      - assertVisible: "Hide password"
