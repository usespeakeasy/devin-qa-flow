# C (speak-ios#10028), first half: open email sign-in and focus the email field so the
# keyboard bar shows Passwords. The AutoFill picker is missing from the tree, so the case
# script taps the bar (201,571 pt, software keyboard on), matches Face ID
# (notifyutil com.apple.BiometricKit_Sim.pearl.match) and taps the suggested row (187,243 pt),
# then reads both fields with axe.
# Entry: signed out, welcome screen, the pool credential saved in Passwords.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: ../../common/open-email-sign-in.yaml
- tapOn:
    id: auth.email.field
- assertVisible: "Passwords"
