# E (speak-ios#10028): Forgot your password? prefills the typed email; Submit shows the sent
# alert; OK returns to sign-in with the same email.
# Entry: signed out, welcome screen. Pass -e EMAIL (the dev reset email is harmless).
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: ../../common/open-email-sign-in.yaml
- tapOn:
    id: auth.email.field
- inputText: ${EMAIL}
- tapOn:
    id: auth.password-reset.open
- extendedWaitUntil:
    visible:
      id: auth.password-reset.screen
    timeout: 10000
- copyTextFrom:
    id: auth.password-reset.email
- assertTrue: ${maestro.copiedText == EMAIL}
- tapOn:
    id: auth.password-reset.submit
- extendedWaitUntil:
    visible: "Password reset email sent to .*"
    timeout: 15000
- takeScreenshot: reset-password-alert
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: auth.sign-in.screen
    timeout: 10000
- copyTextFrom:
    id: auth.email.field
- assertTrue: ${maestro.copiedText == EMAIL}
