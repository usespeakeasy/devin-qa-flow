# B (speak-ios#10028): wrong password shows the sign-in error; editing either field clears it.
# Entry: signed out, welcome screen. Pass -e EMAIL.
appId: ${APP_ID}
env:
  APP_ID: com.selabs.speak-v2.dev
---
- runFlow: ../../common/open-email-sign-in.yaml
- tapOn:
    id: auth.email.field
- inputText: ${EMAIL}
- tapOn:
    id: auth.password.field
- inputText: "wrongpass123"
- tapOn:
    id: auth.sign-in.submit
- extendedWaitUntil:
    visible: "The email or password is incorrect."
    timeout: 15000
- takeScreenshot: wrong-password-error
- tapOn:
    id: auth.password.field
- inputText: "4"
- assertNotVisible: "The email or password is incorrect."
# Refocusing a secure field clears it on the next keystroke, so type the wrong password again.
- tapOn:
    id: auth.password.field
- inputText: "wrongpass123"
- tapOn:
    id: auth.sign-in.submit
- extendedWaitUntil:
    visible: "The email or password is incorrect."
    timeout: 15000
- tapOn:
    id: auth.email.field
- inputText: " "
- assertNotVisible: "The email or password is incorrect."
